{id:"m7", belt:"green", title:"DMAIC: Measure", time:"90 min",
summary:"Collect trustworthy data, describe it with basic statistics, and establish the baseline and process capability.",
objectives:[
 "Distinguish continuous and discrete data and why it matters",
 "Write operational definitions and a data collection plan",
 "Explain measurement system analysis (MSA) and Gage R&R",
 "Calculate mean, median, standard deviation and interpret histograms, run charts and Pareto charts",
 "Calculate and interpret Cp and Cpk"],
sections:[
{h:"Y = f(X)", html:`
<p>The core idea of Six Sigma: the output you care about (<strong>Y</strong>, e.g. refund lead time) is a function of inputs and process variables (<strong>X's</strong>, e.g. channel, payment method, approval threshold, staffing). In Measure you quantify Y and start collecting data on the likely X's. In Analyze you prove which X's matter.</p>`},
{h:"Types of data", html:`
<div class="tbl"><table>
<tr><th>Type</th><th>Description</th><th>Examples</th><th>Information value</th></tr>
<tr><td>Continuous (variable)</td><td>Measured on a scale, can be subdivided</td><td>Time, cost, weight, temperature</td><td>High: small samples tell you a lot</td></tr>
<tr><td>Discrete: count</td><td>Whole-number counts</td><td>Errors per invoice, calls per hour</td><td>Medium</td></tr>
<tr><td>Discrete: attribute / binary</td><td>Pass/fail, yes/no, category</td><td>On time yes/no, approved/rejected</td><td>Low: needs large samples</td></tr>
</table></div>
<p>Prefer continuous data when you can. "Was the refund on time?" (yes/no) tells you less than "how many days did the refund take?" You can always convert continuous to binary later; you can't go the other way.</p>`},
{h:"Operational definitions and the data collection plan", html:`
<p>An <strong>operational definition</strong> describes exactly how something is measured so two people get the same number. "Refund lead time" could start when the customer clicks a button, when the request reaches the queue, or when the item is returned. Pick one and write it down.</p>
<div class="formula">Refund lead time = business days from the timestamp the
refund request is created in the CRM (field: created_at)
to the timestamp the payment file is sent to the bank
(field: pay_file_sent). Excludes weekends and public holidays.</div>
<p>A <strong>data collection plan</strong> lists: what to measure, operational definition, data type, source, sample size, who collects it, when, and how it will be displayed. Collect data on the Y <em>and</em> on candidate X's (stratification factors like region, product, shift, channel) at the same time.</p>`},
{h:"Sampling", html:`
<ul>
<li><strong>Random sampling</strong>: every unit has an equal chance; good for stable populations.</li>
<li><strong>Stratified sampling</strong>: sample within subgroups (e.g. each region) so all are represented.</li>
<li><strong>Systematic sampling</strong>: every n-th unit (every 10th invoice).</li>
<li><strong>Subgroup sampling</strong>: small samples taken at regular intervals, used for control charts.</li>
</ul>
<p>Watch for bias: sampling only easy cases, only one shift, or only the cases someone remembers. Transactional systems often let you pull 100% of records; still check the data is clean.</p>`},
{h:"Measurement system analysis (MSA)", html:`
<p>Before trusting data, check the measurement system. Observed variation = true process variation + measurement variation. If the measuring is noisy, you may "fix" a problem that doesn't exist.</p>
<ul>
<li><strong>Accuracy (bias)</strong>: is the average measurement correct?</li>
<li><strong>Repeatability</strong>: does the same person get the same result measuring the same thing twice?</li>
<li><strong>Reproducibility</strong>: do different people get the same result?</li>
<li><strong>Stability</strong>: is it consistent over time?</li>
</ul>
<p>A <strong>Gage R&R</strong> study quantifies repeatability and reproducibility for continuous data. Common guideline: under 10% of total variation is acceptable, 10–30% may be acceptable depending on use, over 30% is not acceptable. For attribute data (e.g. auditors classifying invoices as correct/incorrect), use an <strong>attribute agreement analysis</strong>: have several appraisers classify the same sample of known items twice and check agreement with each other and with the standard.</p>
<div class="callout example"><span class="eyebrow">Business example</span><p>Three quality reviewers scored the same 30 recorded customer calls. They agreed with each other only 68% of the time on whether a call was "resolved". The team rewrote the definition of "resolved" with examples and retrained, reaching 94% agreement before collecting baseline data.</p></div>`},
{h:"Describing data", html:`
<p><strong>Central tendency:</strong> the <em>mean</em> (average) is sensitive to outliers; the <em>median</em> (middle value) isn't. For skewed data like lead times, report both.</p>
<p><strong>Spread:</strong> the <em>range</em> (max − min) and the <em>standard deviation</em> (typical distance of points from the mean).</p>
<div class="formula">Sample standard deviation  s = √( Σ(xᵢ − x̄)² ÷ (n − 1) )</div>
<p>For a roughly normal distribution, about 68% of values fall within ±1σ of the mean, 95% within ±2σ, and 99.7% within ±3σ.</p>
<p><strong>Graphs:</strong></p>
<ul>
<li><strong>Histogram</strong>: shape of the distribution: normal, skewed, bimodal (two humps often mean two different processes mixed together, e.g. two teams).</li>
<li><strong>Run chart</strong>: data in time order; shows trends, shifts and cycles.</li>
<li><strong>Pareto chart</strong>: categories sorted by frequency with a cumulative line. Usually about 20% of categories cause about 80% of the problem.</li>
<li><strong>Box plot</strong>: compares distributions across groups (e.g. lead time by region).</li>
</ul>`},
{h:"Process capability: Cp and Cpk", html:`
<p>Capability compares the <strong>voice of the process</strong> (its natural spread) with the <strong>voice of the customer</strong> (specification limits).</p>
<div class="formula">Cp  = (USL − LSL) ÷ 6σ
Cpk = min( (USL − μ) ÷ 3σ , (μ − LSL) ÷ 3σ )</div>
<ul>
<li><strong>Cp</strong> measures potential: could the process fit inside the specs if it were centred?</li>
<li><strong>Cpk</strong> measures actual performance, accounting for off-centre. Cpk ≤ Cp always.</li>
<li>Rules of thumb: Cpk &lt; 1.0 not capable; 1.0–1.33 marginal; ≥ 1.33 capable; ≥ 2.0 corresponds to six sigma short-term.</li>
<li>Many service CTQs only have one limit (an upper limit for time). Then use only the relevant side: Cpk = (USL − μ) ÷ 3σ.</li>
</ul>
<div class="callout example"><span class="eyebrow">Worked example</span><p>Call handling time must be under 10 minutes (USL = 10). Mean = 7 min, σ = 1.2 min.<br>Cpk = (10 − 7) ÷ (3 × 1.2) = 3 ÷ 3.6 = <strong>0.83</strong>. Not capable: a meaningful share of calls exceeds 10 minutes. To reach Cpk 1.33 you'd need to cut σ to 0.75 min or lower the mean to about 5.2 min.</p></div>
<p>Only calculate capability on a <strong>stable</strong> process (check with a control chart first). For non-normal data like lead times, use transformations or non-normal capability methods, or simply report % beyond spec.</p>`}
],
quiz:[
{q:"Which is continuous data?", o:["Number of complaints per week","Whether an order shipped on time","Time to approve a loan in hours","Customer region"], a:2, why:"Time can be measured on a continuous scale."},
{q:"Why do we prefer continuous data where possible?", o:["It's easier to collect","It gives more information from smaller samples","Managers prefer it","It never has outliers"], a:1, why:"Continuous data carries more information per data point than pass/fail."},
{q:"A Gage R&R result of 42% of total variation means:", o:["The measurement system is excellent","The measurement system is acceptable","The measurement system is not acceptable","The process is capable"], a:2, why:"Over 30% is unacceptable; fix the measurement before analysing the process."},
{q:"A histogram of lead times shows two distinct peaks. The most likely explanation is:", o:["Normal data","Two different processes or groups mixed together","Measurement error","A perfect process"], a:1, why:"Bimodal data usually means stratification is needed, e.g. by team, product or channel."},
{q:"USL = 20, LSL = 8, mean = 16, σ = 1.5. Cpk is:", o:["0.89","1.33","1.78","2.67"], a:0, why:"(20−16)/4.5 = 0.89; (16−8)/4.5 = 1.78. Cpk is the minimum: 0.89."},
{q:"For the same process, Cp is:", o:["0.89","1.33","1.78","2.67"], a:1, why:"(20 − 8) ÷ (6 × 1.5) = 12 ÷ 9 = 1.33. Capable if centred, but it isn't."},
{q:"Repeatability in MSA refers to:", o:["Different appraisers getting the same result","The same appraiser getting the same result on repeated measurements","Measurements staying stable over months","Measurements matching a standard"], a:1, why:"Repeatability = same person, same item, same gauge. Reproducibility = different people."},
{q:"For lead-time data heavily skewed to the right, which statistic best describes the typical case?", o:["Mean","Median","Range","Maximum"], a:1, why:"The median isn't pulled by long-tail outliers."},
{q:"Which chart shows data in time order to reveal trends and shifts?", o:["Pareto chart","Histogram","Run chart","Pie chart"], a:2, why:"Run charts plot data sequentially over time."}
],
questions:[
{q:"Write an operational definition for 'first-contact resolution' in a customer service centre.", model:"A contact is first-contact resolved if the customer does not contact us again about the same issue (same account, same case category) through any channel within 7 calendar days of the original contact being closed. Measured from the CRM using account ID and case category; contacts closed as 'transferred' or 'callback scheduled' are not counted as resolved."},
{q:"Practice calculation: Seven invoice approval times (hours): 4, 6, 5, 30, 7, 5, 6. Calculate mean, median and range. What does the comparison tell you?", model:"Sorted: 4, 5, 5, 6, 6, 7, 30. Mean = 63 ÷ 7 = 9.0 h. Median = 6 h. Range = 30 − 4 = 26 h. The mean is pulled up by one outlier (30 h). Typical approval takes about 6 hours; the outlier deserves investigation (approver on leave? exception case?). Report the median and look at the tail separately."},
{q:"Practice calculation: Order delivery must take no more than 48 hours (USL = 48, no lower limit). The process mean is 36 hours with σ = 5 hours. Calculate Cpk and interpret it. What would σ need to be for Cpk = 1.33?", model:"Cpk = (48 − 36) ÷ (3 × 5) = 12 ÷ 15 = 0.80. Not capable: roughly 0.8% of orders exceed 48 hours (z = 2.4). For Cpk = 1.33: σ = 12 ÷ (3 × 1.33) ≈ 3.0 hours. Alternatively, lowering the mean to 28 hours at σ = 5 gives Cpk = 20 ÷ 15 = 1.33."},
{q:"Design a data collection plan for a project on late supplier payments.", model:"Y: days late (payment date − due date), continuous, from ERP payment and invoice tables, all invoices Jan–Jun. X's: supplier, invoice channel (EDI/PDF/paper), PO vs non-PO, amount band, approver, exception type, day of week received, AP clerk. Operational definitions written for each. Sample: 100% extract (approx. 14,000 invoices), plus manual review of 200 random late invoices for reason codes. Owner: project analyst with ERP admin. Display: histogram, Pareto of exception types, box plots by channel and approver, run chart by week."}
]},

/* ---------------------------------------------------------------- 8 */
{id:"m8", belt:"green", title:"DMAIC: Analyze", time:"100 min",
summary:"Find and prove root causes using fishbone, 5 Whys, Pareto, FMEA, correlation, regression and hypothesis testing.",
objectives:[
 "Generate potential causes with a fishbone diagram and 5 Whys",
 "Prioritise causes with Pareto analysis and FMEA",
 "Explain correlation vs. causation and read a scatter plot and R²",
 "Set up a hypothesis test and interpret a p-value",
 "Choose the right statistical test for the data type"],
sections:[
{h:"From many causes to the vital few", html:`
<p>Analyze works like a funnel: brainstorm many possible causes (X's), narrow them with data and logic to a few <strong>verified root causes</strong>. Skipping verification is the most common mistake: teams fix the cause everyone believes in rather than the one the data supports.</p>`},
{h:"Fishbone (Ishikawa) diagram", html:`
<p>Write the problem (the effect) at the "head" and group possible causes along the bones. For manufacturing, the classic 6M categories are Man (people), Machine, Method, Material, Measurement, Mother Nature (environment). For services, many teams use the <strong>4 or 8 P's</strong> or adapt the 6M:</p>
<div class="tbl"><table>
<tr><th>Category</th><th>Example causes: "Refunds take 9 days"</th></tr>
<tr><td>People</td><td>New staff unfamiliar with exceptions; no back-up approver</td></tr>
<tr><td>Process / Method</td><td>Refunds batched twice a week; all refunds need manager approval</td></tr>
<tr><td>Systems (Machine)</td><td>Warehouse and CRM not integrated; manual return confirmation</td></tr>
<tr><td>Inputs (Material)</td><td>Request forms missing order number; wrong payment method details</td></tr>
<tr><td>Measurement</td><td>No visibility of ageing refunds; KPI counts only processed volume</td></tr>
<tr><td>Environment / Policy</td><td>Bank payment run cut-off; peak returns after holidays</td></tr>
</table></div>`},
{h:"5 Whys", html:`
<p>Ask "why?" repeatedly until you reach a cause you can act on, usually a process or system cause, not a person.</p>
<ol>
<li>Why was the refund late? <em>It waited 4 days for manager approval.</em></li>
<li>Why did it wait? <em>The manager approves refunds in a batch on Tuesdays and Fridays.</em></li>
<li>Why in a batch? <em>Every refund requires approval, about 300 a week, so it's done in bulk.</em></li>
<li>Why does every refund require approval? <em>A fraud incident three years ago led to a blanket rule.</em></li>
<li>Why is it still blanket? <em>Nobody reviewed the rule against current fraud data; 96% of refunds are under $100 and fraud loss there is negligible.</em></li>
</ol>
<p>Root cause: an outdated blanket approval policy. Countermeasure: risk-based approval threshold. Always verify each "why" with evidence, and note that one effect can have several causal chains.</p>`},
{h:"Pareto analysis", html:`
<p>Sort causes or defect categories by frequency (or cost) and add a cumulative percentage line. Focus on the bars that make up roughly 80% of the impact.</p>
<div class="tbl"><table>
<tr><th>Delay reason (refunds &gt; 5 days)</th><th class="num">Count</th><th class="num">%</th><th class="num">Cumulative</th></tr>
<tr><td>Waiting for manager approval</td><td class="num">212</td><td class="num">44%</td><td class="num">44%</td></tr>
<tr><td>Return not confirmed by warehouse</td><td class="num">131</td><td class="num">27%</td><td class="num">71%</td></tr>
<tr><td>Missing / wrong payment details</td><td class="num">68</td><td class="num">14%</td><td class="num">85%</td></tr>
<tr><td>System error in payment file</td><td class="num">39</td><td class="num">8%</td><td class="num">93%</td></tr>
<tr><td>Other</td><td class="num">32</td><td class="num">7%</td><td class="num">100%</td></tr>
</table></div>
<p>Weight by impact where it matters: the most frequent defect isn't always the most expensive.</p>`},
{h:"FMEA: failure mode and effects analysis", html:`
<p>FMEA ranks risks in a process step by step. For each step, list how it can fail (failure mode), the effect, the cause and current controls. Score each 1–10:</p>
<ul>
<li><strong>Severity (S)</strong>: how bad is the effect?</li>
<li><strong>Occurrence (O)</strong>: how often does the cause happen?</li>
<li><strong>Detection (D)</strong>: how likely is it we <em>won't</em> catch it before the customer? (10 = undetectable)</li>
</ul>
<div class="formula">RPN (Risk Priority Number) = S × O × D   (range 1–1,000)</div>
<p>Act on the highest RPNs, but also on any failure with very high severity (9–10) regardless of RPN. Newer AIAG-VDA guidance replaces RPN with "action priority" tables for the same reason. Re-score after actions to show risk reduction.</p>`},
{h:"Correlation, causation and regression", html:`
<p>A <strong>scatter plot</strong> shows the relationship between two continuous variables. The <strong>correlation coefficient r</strong> ranges from −1 to +1: near ±1 is a strong linear relationship, near 0 is none.</p>
<p><strong>Correlation is not causation.</strong> Ice-cream sales and drowning deaths both rise in summer; hot weather drives both. In business, "tickets handled by senior agents take longer" may be because senior agents get the hardest tickets. Always look for a lurking variable.</p>
<p><strong>Simple linear regression</strong> fits a line Y = b₀ + b₁X. <strong>R²</strong> (coefficient of determination) is the share of variation in Y explained by X. R² = 0.64 means 64% of the variation is explained. <strong>Multiple regression</strong> uses several X's at once.</p>`},
{h:"Hypothesis testing", html:`
<p>Hypothesis tests tell you whether a difference you see in a sample is likely real or just chance.</p>
<ul>
<li><strong>Null hypothesis (H₀)</strong>: no difference / no effect (e.g. both teams have the same mean lead time).</li>
<li><strong>Alternative hypothesis (H₁)</strong>: there is a difference.</li>
<li><strong>p-value</strong>: the probability of seeing a difference at least this large if H₀ were true.</li>
<li><strong>Significance level α</strong>, usually 0.05. If p &lt; α, reject H₀: the difference is statistically significant.</li>
</ul>
<div class="callout"><span class="eyebrow">Memory aid</span><p>"If p is low, the null must go." A p-value of 0.003 means the observed difference would be very unlikely if there were truly no difference.</p></div>
<p><strong>Errors:</strong> Type I (α) = rejecting H₀ when it's true (false alarm). Type II (β) = failing to reject H₀ when it's false (missed signal). <strong>Power</strong> = 1 − β, the chance of detecting a real effect, which grows with sample size.</p>
<p>Statistical significance isn't practical significance: with 100,000 records, a 0.1-minute difference can be "significant" and meaningless.</p>`},
{h:"Choosing the right test", html:`
<div class="tbl"><table>
<tr><th>Y data</th><th>X data</th><th>Question</th><th>Test</th></tr>
<tr><td>Continuous</td><td>One group vs. a target</td><td>Is the mean different from 5 days?</td><td>1-sample t-test</td></tr>
<tr><td>Continuous</td><td>Two groups</td><td>Do team A and B have different mean lead times?</td><td>2-sample t-test (paired t if before/after on the same units)</td></tr>
<tr><td>Continuous</td><td>3+ groups</td><td>Do the four regions differ?</td><td>One-way ANOVA</td></tr>
<tr><td>Continuous</td><td>Groups (variance)</td><td>Is one team more variable?</td><td>Test for equal variances (F / Levene)</td></tr>
<tr><td>Continuous, non-normal</td><td>Groups</td><td>Do medians differ?</td><td>Mann-Whitney / Kruskal-Wallis</td></tr>
<tr><td>Discrete (proportion)</td><td>Two groups</td><td>Is the error rate different between channels?</td><td>2-proportion test</td></tr>
<tr><td>Discrete (counts in categories)</td><td>Categorical</td><td>Is complaint type associated with region?</td><td>Chi-square test</td></tr>
<tr><td>Continuous</td><td>Continuous</td><td>Does order size predict processing time?</td><td>Correlation / regression</td></tr>
</table></div>`}
],
quiz:[
{q:"A 2-sample t-test comparing lead times for two teams gives p = 0.02 (α = 0.05). You should:", o:["Fail to reject H₀: no difference","Reject H₀: the means likely differ","Collect no more data and stop the project","Conclude team B is lazy"], a:1, why:"p < 0.05, so the difference is statistically significant. Then investigate why, without blame."},
{q:"Which test compares mean processing time across four regional offices?", o:["Chi-square","2-proportion test","One-way ANOVA","Paired t-test"], a:2, why:"ANOVA compares the means of three or more groups."},
{q:"Which test checks whether complaint category is associated with sales channel?", o:["Regression","Chi-square test","1-sample t-test","ANOVA"], a:1, why:"Both variables are categorical counts, so chi-square test of association."},
{q:"FMEA: Severity 8, Occurrence 5, Detection 6. RPN is:", o:["19","40","240","480"], a:2, why:"8 × 5 × 6 = 240."},
{q:"In FMEA, a detection score of 10 means:", o:["Defect is always caught","Defect is almost certainly not caught","Defect is very severe","Defect occurs constantly"], a:1, why:"High detection score = poor detection ability."},
{q:"R² = 0.36 from regressing call time on number of products the customer holds means:", o:["36% of calls involve multiple products","36% of the variation in call time is explained by number of products","The correlation is 0.36","There is no relationship"], a:1, why:"R² is the share of variation explained. (r would be 0.6.)"},
{q:"A Type I error is:", o:["Rejecting H₀ when it is actually true","Failing to reject H₀ when it is false","A data entry error","Using the wrong test"], a:0, why:"A false alarm, probability α."},
{q:"The main purpose of 5 Whys is to:", o:["Assign responsibility","Move past symptoms to an actionable root cause","Generate solutions","Replace data analysis"], a:1, why:"It digs to process/system causes; each why should be verified with evidence."},
{q:"Stores with more staff show higher shrinkage. The best interpretation is:", o:["Staff cause shrinkage","Correlation may reflect a lurking variable such as store size","Shrinkage causes hiring","There's no relationship"], a:1, why:"Bigger stores have both more staff and more shrinkage. Correlation ≠ causation."}
],
questions:[
{q:"Build a fishbone for: 'Customer onboarding takes 23 days versus a 10-day target.' Give at least two causes per category.", model:"People: no dedicated onboarding owner; sales reps unaware of required data. Process: sequential hand-offs (sales → legal → IT → CS) instead of parallel; contract and technical setup can't start until payment confirmed. Systems: CRM and provisioning tool not integrated; manual account creation. Inputs: missing technical contact; incomplete billing details at contract signing. Measurement: no tracking of time per stage; KPI only counts closed deals. Environment/policy: security review required for all customers regardless of size; quarter-end deal spikes."},
{q:"Do a 5 Whys for: 'The monthly sales report was published 3 days late.'", model:"1) Why late? Regional data was missing. 2) Why missing? Two regions submitted spreadsheets after the deadline. 3) Why late? They have to reconcile CRM data against the finance system manually first. 4) Why manual? The CRM product codes don't map to finance product codes. 5) Why no mapping? The CRM was set up separately and no master data owner was assigned. Root cause: no master data governance for product codes. Countermeasure: single product code master with an owner and automated mapping."},
{q:"A team believes 'invoices from new suppliers have more errors'. Which data would you collect, which test would you use, and what result would confirm the hypothesis?", model:"Collect: for a sample of invoices, supplier tenure (new < 6 months vs established) and whether the invoice had an error (yes/no). Y is discrete (proportion with error), X is two groups, so a 2-proportion test (or chi-square). H₀: error rates are equal. If p < 0.05 and the new-supplier error rate is meaningfully higher (e.g. 18% vs 6%), the hypothesis is supported. Then ask why (no onboarding guide? wrong PO references?) to reach root cause."},
{q:"Complete an FMEA row: step 'Enter bank details for refund'. Suggest S, O, D, the RPN, and an action that lowers it.", model:"Failure mode: wrong account number entered. Effect: refund paid to wrong account, customer complaint, financial loss (S = 8). Cause: manual typing from email (O = 5). Current control: none until customer complains (D = 8). RPN = 8 × 5 × 8 = 320. Action: refund to original payment method by default; if bank transfer needed, customer enters details in a secure form with IBAN checksum validation and name-match check. New O = 2, D = 3 → RPN = 48."}
]},

{id:"m9", belt:"green", title:"DMAIC: Improve", time:"75 min",
summary:"Generate and select solutions, design the future-state process, pilot safely and prove the gain.",
objectives:[
 "Generate solutions that target verified root causes",
 "Select solutions with an impact/effort matrix and a Pugh or criteria matrix",
 "Design a future-state process using Lean principles",
 "Plan and evaluate a pilot using PDCA",
 "Know when a designed experiment (DOE) is appropriate"],
sections:[
{h:"Link every solution to a root cause", html:`
<p>Each solution must address a <strong>verified</strong> root cause from Analyze. If it doesn't, it's a pet idea. A simple table keeps you honest:</p>
<div class="tbl"><table>
<tr><th>Root cause (verified)</th><th>Solution</th><th>Expected effect on Y</th></tr>
<tr><td>Blanket manager approval on all refunds</td><td>Auto-approve refunds under $150 with no fraud flag</td><td>Removes ~3.5 days wait for ~90% of refunds</td></tr>
<tr><td>Warehouse return confirmation is manual</td><td>Scan-to-confirm triggers CRM status update</td><td>Removes ~2 days wait</td></tr>
<tr><td>Wrong payment details</td><td>Refund to original payment method by default</td><td>Cuts rework loop for 14% of cases</td></tr>
</table></div>`},
{h:"Generating solutions", html:`
<ul>
<li><strong>Brainstorming</strong>: quantity first, judge later. Use silent writing before discussion so quieter people contribute.</li>
<li><strong>Benchmarking</strong>: how do other teams or companies do it?</li>
<li><strong>SCAMPER</strong>: Substitute, Combine, Adapt, Modify, Put to other use, Eliminate, Reverse.</li>
<li><strong>Lean design principles</strong>: eliminate steps, combine hand-offs, move checks upstream (quality at source), run steps in parallel, create a fast lane for simple cases, standardise, automate only after simplifying.</li>
</ul>
<div class="callout"><span class="eyebrow">Rule</span><p>Simplify, then standardise, then automate. Automating a bad process gives you a fast bad process.</p></div>`},
{h:"Selecting solutions", html:`
<p><strong>Impact/effort matrix:</strong> plot each idea. Do quick wins (high impact, low effort) first; plan major projects (high impact, high effort); fill in low-effort/low-impact "fill-ins" when convenient; drop the rest.</p>
<p><strong>Pugh matrix:</strong> compare options against a baseline (the "datum", often the current process) on weighted criteria. Score each option better (+), same (S) or worse (−) per criterion.</p>
<div class="tbl"><table>
<tr><th>Criterion (weight)</th><th>Datum: current</th><th>A: auto-approve &lt; $150</th><th>B: hire 2nd approver</th><th>C: daily approval</th></tr>
<tr><td>Lead time reduction (5)</td><td>S</td><td>+</td><td>+</td><td>+</td></tr>
<tr><td>Cost (3)</td><td>S</td><td>+</td><td>−</td><td>S</td></tr>
<tr><td>Fraud risk (4)</td><td>S</td><td>−</td><td>S</td><td>S</td></tr>
<tr><td>Ease of implementation (2)</td><td>S</td><td>+</td><td>−</td><td>+</td></tr>
<tr><td><strong>Weighted total</strong></td><td>0</td><td><strong>+6</strong></td><td>0</td><td>+7</td></tr>
</table></div>
<p>Pugh matrices often lead to <strong>hybrid</strong> solutions: here, daily approval (C) for refunds over $150 combined with auto-approval (A) plus a fraud flag below $150, which strengthens A's weak point.</p>`},
{h:"Designing the future state", html:`
<p>Draw the future-state map before you implement. Typical changes in office processes:</p>
<ul>
<li>Remove approvals that almost never reject anything.</li>
<li>Collect complete information at intake (one form, validated) to kill rework loops.</li>
<li>Replace batches with daily or continuous flow.</li>
<li>Create triage: simple cases go through a fast lane, complex ones to specialists.</li>
<li>Put WIP limits and a visual board on the main queues.</li>
<li>Write standard work and update training for the new process.</li>
</ul>`},
{h:"Pilot with PDCA", html:`
<p>Never roll out untested changes to the whole organisation. Use <strong>PDCA</strong> (Plan–Do–Check–Act, the Deming/Shewhart cycle):</p>
<ol>
<li><strong>Plan</strong>: what you'll change, where (one team, one region), for how long, the success criteria and the guardrail metrics.</li>
<li><strong>Do</strong>: run the pilot; record issues and deviations.</li>
<li><strong>Check</strong>: compare results to baseline with data (e.g. a 2-sample t-test or before/after control chart).</li>
<li><strong>Act</strong>: adopt, adapt or abandon. Then scale or run another cycle.</li>
</ol>
<p>Also run a quick <strong>FMEA on the new process</strong> to catch new risks your changes create.</p>`},
{h:"Design of experiments (DOE)", html:`
<p>When several X's might interact (e.g. email subject line, send time and discount level on response rate), testing one factor at a time is slow and misses interactions. <strong>DOE</strong> changes several factors at once in a planned way. A <strong>2-level full factorial</strong> with 3 factors needs 2³ = 8 runs and estimates each factor's effect and their interactions. A/B testing in digital channels is the simplest DOE.</p>
<p>At the Green Belt level, you should recognise when DOE is appropriate and plan a simple one with a Black Belt's support.</p>`}
],
quiz:[
{q:"What should every proposed solution be linked to?", o:["The sponsor's favourite idea","A verified root cause","The cheapest option","An automation tool"], a:1, why:"Solutions that don't address verified root causes won't move Y."},
{q:"'Simplify, standardise, then automate' is recommended because:", o:["Automation is always expensive","Automating a wasteful process locks the waste in and speeds it up","Standardising is mandatory by law","Simplifying is optional"], a:1, why:"You get a fast bad process otherwise."},
{q:"In a Pugh matrix, the datum is:", o:["The highest-scoring option","The baseline everything is compared against","The weighting column","The final decision"], a:1, why:"Options are scored better/same/worse than the datum."},
{q:"High impact, low effort ideas on an impact/effort matrix are:", o:["Major projects","Quick wins","Fill-ins","Thankless tasks"], a:1, why:"Do them first."},
{q:"In PDCA, the 'Check' step is about:", o:["Getting approvals","Comparing results to the baseline and the goal using data","Writing the charter","Training staff"], a:1, why:"Check = study the results. Some call it PDSA (Study)."},
{q:"A 2-level full factorial DOE with 4 factors requires how many runs (no replication)?", o:["4","8","16","32"], a:2, why:"2⁴ = 16."},
{q:"Why pilot before full rollout?", o:["To delay the project","To test effectiveness and catch unintended effects at small scale","Because sponsors require it","To avoid writing standard work"], a:1, why:"Lower risk, real data, chance to adjust."},
{q:"Moving an accuracy check from the end of a process to the point where data is entered is an example of:", o:["Overproduction","Quality at source","Batching","Inspection"], a:1, why:"Catch or prevent errors where they're created."}
],
questions:[
{q:"For each root cause, propose a solution and say whether it's a quick win or a major project: (1) Invoices arrive by PDF email and are keyed manually. (2) Approvers are travelling and approvals wait. (3) 30% of invoices lack a PO number.", model:"(1) Supplier portal or e-invoicing with OCR capture: major project (IT, supplier onboarding); interim quick win: standard PDF template sent to top 20 suppliers. (2) Mobile approval plus a delegate rule when the approver is out of office for more than 1 day: quick win if the system supports it. (3) 'No PO, no pay' policy communicated to suppliers, with PO number as a mandatory field in the portal: medium effort; quick win version is a templated email returning invoices without PO within 24 hours."},
{q:"Design a pilot for auto-approving low-value refunds. What do you measure, for how long, and what are your stop criteria?", model:"Scope: online refunds under $150 for one country for 4 weeks. Primary metric: refund lead time (target: median ≤ 2 days). Guardrails: refund fraud rate (stop if > 0.5% of auto-approved value, vs baseline 0.2%), customer complaints, cost per refund. Daily monitoring dashboard. Stop criteria: fraud above threshold, payment file errors, or any regulatory issue. At the end, compare before/after with a control chart and a Mann-Whitney test on lead times; decide adopt/adapt/abandon."},
{q:"Your team wants to buy RPA (robotic process automation) to speed up data entry. As the Green Belt, what questions do you ask first?", model:"Is the data entry step necessary at all, or could the data be captured once at source (integration, portal)? What share of cases are standard vs exceptions (bots struggle with exceptions)? Is the process stable and standardised (if not, the bot will break)? What's the root cause the bot addresses, and what's the expected effect on Y? Who will maintain the bot? Would a simpler fix (template, validation) achieve most of the benefit?"}
]},

{id:"m10", belt:"green", title:"DMAIC: Control", time:"80 min",
summary:"Hold the gains: control plans, statistical process control, response plans and handover to the process owner.",
objectives:[
 "Distinguish common-cause from special-cause variation",
 "Choose the right control chart for the data",
 "Read a control chart using standard out-of-control rules",
 "Write a control plan and a response plan",
 "Hand a project over and close it properly"],
sections:[
{h:"Why gains slip", html:`
<p>Without control, processes drift back to old habits: people leave, workarounds creep in, a system update reverses a setting, and the old KPI still rewards the old behaviour. Control is about making the new way the <em>easy</em> way and noticing quickly when something changes.</p>`},
{h:"Common cause vs special cause", html:`
<ul>
<li><strong>Common-cause variation</strong>: the natural, built-in noise of a stable process. Many small causes. Reducing it requires changing the process (a management decision).</li>
<li><strong>Special-cause variation</strong>: an unusual, assignable event (a system outage, a new untrained hire, a supplier change). Find it and deal with it.</li>
</ul>
<p>Two classic mistakes (Deming): <strong>tampering</strong> (reacting to common-cause noise as if it were special, which makes variation worse) and <strong>ignoring</strong> a real special cause.</p>`},
{h:"Control charts", html:`
<p>A control chart plots data over time with a centre line (mean) and <strong>control limits</strong> at about ±3 standard deviations, calculated <em>from the process data</em>. Control limits are the voice of the process; they are <strong>not</strong> the specification limits, which are the voice of the customer.</p>
<div class="chart" role="img" aria-label="Individuals control chart of daily refund lead time showing one point above the upper control limit on day 15">
<svg viewBox="0 0 620 230" xmlns="http://www.w3.org/2000/svg" font-family="IBM Plex Mono, monospace" font-size="11">
<line x1="40" y1="40" x2="560" y2="40" stroke="var(--ucl)" stroke-dasharray="5 4" stroke-width="1.5"/>
<line x1="40" y1="115" x2="560" y2="115" stroke="var(--muted)" stroke-width="1.5"/>
<line x1="40" y1="190" x2="560" y2="190" stroke="var(--ucl)" stroke-dasharray="5 4" stroke-width="1.5"/>
<text x="566" y="44" fill="var(--ucl)">UCL 4.1</text>
<text x="566" y="119" fill="var(--muted)">CL 2.6</text>
<text x="566" y="194" fill="var(--ucl)">LCL 1.1</text>
<polyline fill="none" stroke="var(--accent)" stroke-width="1.6" points="50,108 76,92 102,126 128,118 154,98 180,134 206,112 232,104 258,140 284,121 310,95 336,128 362,110 388,86 414,26 440,117 466,101 492,131 518,112 544,99"/>
<g fill="var(--accent)">
<circle cx="50" cy="108" r="3.5"/><circle cx="76" cy="92" r="3.5"/><circle cx="102" cy="126" r="3.5"/><circle cx="128" cy="118" r="3.5"/><circle cx="154" cy="98" r="3.5"/><circle cx="180" cy="134" r="3.5"/><circle cx="206" cy="112" r="3.5"/><circle cx="232" cy="104" r="3.5"/><circle cx="258" cy="140" r="3.5"/><circle cx="284" cy="121" r="3.5"/><circle cx="310" cy="95" r="3.5"/><circle cx="336" cy="128" r="3.5"/><circle cx="362" cy="110" r="3.5"/><circle cx="388" cy="86" r="3.5"/><circle cx="440" cy="117" r="3.5"/><circle cx="466" cy="101" r="3.5"/><circle cx="492" cy="131" r="3.5"/><circle cx="518" cy="112" r="3.5"/><circle cx="544" cy="99" r="3.5"/>
</g>
<circle cx="414" cy="26" r="5" fill="var(--ucl)"/>
<text x="424" y="22" fill="var(--ucl)">Day 15: bank file failure</text>
<text x="40" y="218" fill="var(--muted)">Day 1</text>
<text x="520" y="218" fill="var(--muted)">Day 20</text>
<text x="40" y="18" fill="var(--muted)">Refund lead time, days (I chart)</text>
</svg></div>`},
{h:"Choosing a control chart", html:`
<div class="tbl"><table>
<tr><th>Data</th><th>Situation</th><th>Chart</th></tr>
<tr><td>Continuous</td><td>One measurement at a time (e.g. daily average lead time)</td><td>I-MR (Individuals & Moving Range)</td></tr>
<tr><td>Continuous</td><td>Small subgroups, n ≈ 2–9</td><td>X̄-R (Xbar and Range)</td></tr>
<tr><td>Continuous</td><td>Larger subgroups, n ≥ 10</td><td>X̄-S (Xbar and Standard deviation)</td></tr>
<tr><td>Attribute: defectives</td><td>Proportion defective, sample size varies</td><td>p chart</td></tr>
<tr><td>Attribute: defectives</td><td>Number defective, constant sample size</td><td>np chart</td></tr>
<tr><td>Attribute: defects</td><td>Count of defects, constant area of opportunity</td><td>c chart</td></tr>
<tr><td>Attribute: defects</td><td>Defects per unit, varying area of opportunity</td><td>u chart</td></tr>
</table></div>
<p>For an I chart: <code>UCL/LCL = X̄ ± 2.66 × MR̄</code>, where MR̄ is the average moving range between consecutive points.</p>`},
{h:"Out-of-control rules", html:`
<p>The common rules (Western Electric / Nelson) flag special causes:</p>
<ol>
<li>One point beyond a 3σ control limit.</li>
<li>A run of 8 or more consecutive points on one side of the centre line (some use 7 or 9). Signals a shift.</li>
<li>6 or more points in a row steadily increasing or decreasing. Signals a trend.</li>
<li>2 out of 3 consecutive points beyond 2σ on the same side.</li>
<li>4 out of 5 consecutive points beyond 1σ on the same side.</li>
<li>14 points alternating up and down. Signals over-adjustment or two alternating sources.</li>
</ol>
<p>After an improvement, a sustained shift in the desired direction is the evidence you want: recalculate limits from the new stable period.</p>`},
{h:"The control plan", html:`
<p>The control plan is the handover document: what to monitor, how, how often, who owns it and what to do when it goes wrong.</p>
<div class="tbl"><table>
<tr><th>Process step</th><th>What to control</th><th>Spec / target</th><th>Method</th><th>Frequency</th><th>Owner</th><th>Reaction plan</th></tr>
<tr><td>Refund approval</td><td>% auto-approved refunds flagged as fraud</td><td>&lt; 0.5%</td><td>Fraud report</td><td>Weekly</td><td>Refunds lead</td><td>&gt; 0.5%: lower threshold to $75, review with risk team within 48 h</td></tr>
<tr><td>End to end</td><td>Refund lead time</td><td>Median ≤ 2 days, 90% ≤ 5</td><td>I-MR chart on daily median</td><td>Daily</td><td>Process owner</td><td>Any rule violation: investigate within 1 day, log cause</td></tr>
<tr><td>Return confirmation</td><td>Scan compliance</td><td>≥ 98% scanned</td><td>System report</td><td>Daily</td><td>Warehouse supervisor</td><td>&lt; 98%: refresher at next huddle</td></tr>
</table></div>`},
{h:"Sustaining the gains", html:`
<ul>
<li><strong>Error-proofing</strong> beats procedures; procedures beat training; training beats reminders.</li>
<li>Update <strong>standard work</strong>, SOPs, training materials and onboarding.</li>
<li>Change <strong>KPIs and incentives</strong> to reward the new behaviour.</li>
<li>Build the metrics into the team's <strong>visual board</strong> and daily huddle.</li>
<li>Run a <strong>process audit</strong> at 30, 60 and 90 days.</li>
<li><strong>Close the project</strong>: confirm results with finance (validated savings), document lessons learned, celebrate the team, and share the solution with other sites that could replicate it.</li>
</ul>`}
],
quiz:[
{q:"Control limits on a control chart are calculated from:", o:["Customer specifications","Management targets","The process data itself","Industry benchmarks"], a:2, why:"Control limits are the voice of the process (about ±3σ). Specs are the voice of the customer."},
{q:"Which chart for the daily proportion of late orders when the number of orders varies each day?", o:["c chart","p chart","X̄-R chart","np chart"], a:1, why:"Proportion defective with varying sample size → p chart."},
{q:"Which chart for the number of errors per invoice batch when batch sizes vary?", o:["u chart","c chart","p chart","I-MR chart"], a:0, why:"Defects per unit with varying opportunity → u chart."},
{q:"Nine consecutive points above the centre line most likely indicate:", o:["Common-cause variation","A process shift (special cause)","Perfect control","A measurement error"], a:1, why:"A long run on one side signals a shift."},
{q:"Adjusting a stable process every time a point is above average is called:", o:["Kaizen","Tampering","Poka-yoke","Heijunka"], a:1, why:"Reacting to common-cause noise increases variation."},
{q:"An I-MR chart has X̄ = 50 and MR̄ = 6. The UCL is about:", o:["56","62","66","68"], a:2, why:"50 + 2.66 × 6 = 65.96."},
{q:"Who should own the control plan after the project closes?", o:["The Black Belt","The process owner","The sponsor's assistant","An external auditor"], a:1, why:"The process owner runs the process day to day."},
{q:"Which control is strongest for sustaining a gain?", o:["An email reminder","Training","A written procedure","Error-proofing the process"], a:3, why:"Make the error impossible rather than relying on memory."}
],
questions:[
{q:"Practice calculation: Daily % of tickets breaching SLA for 10 days: 4, 6, 5, 7, 5, 4, 6, 5, 14, 5. Compute the mean and the moving ranges, then the I-chart limits. Is any point out of control?", model:"Mean = 61 ÷ 10 = 6.1. Moving ranges: 2, 1, 2, 2, 1, 2, 1, 9, 9 → MR̄ = 29 ÷ 9 ≈ 3.22. UCL = 6.1 + 2.66 × 3.22 ≈ 14.7; LCL = 6.1 − 8.57 < 0, so 0. Day 9 (14) is just inside the limit, so technically no rule 1 violation, but the outlier inflates MR̄. In practice, investigate day 9 and, if it's a known special cause (outage), exclude it and recalculate: without day 9, mean ≈ 5.2, MR̄ ≈ 1.4, UCL ≈ 8.9 and day 9 is clearly out of control."},
{q:"Write a reaction plan for a control chart on daily invoice-processing lead time.", model:"Trigger: any point beyond the control limits, or 8 consecutive points above the centre line. Step 1: AP team lead checks within one working day for an obvious special cause (system outage, absence, unusual invoice volume, supplier batch) and logs it on the chart. Step 2: if a cause is found, contain it (reassign work, escalate to IT) and record the action. Step 3: if no cause is found or the signal repeats, the process owner convenes a 30-minute problem-solving huddle (5 Whys). Step 4: review in the monthly process review; update standard work if the cause is systemic."},
{q:"Your project cut refund lead time from 9.4 to 2.1 days. Six months later, it's back to 6 days. List the likely reasons and what should have been in the control plan.", model:"Likely reasons: auto-approval threshold quietly lowered after an incident without analysis; new staff not trained on the new process; warehouse scanning compliance dropped; dashboard stopped being reviewed after the Black Belt left; old KPI (volume processed) still rewarded batching. Control plan should have had: an owner per metric with a review cadence, control charts with reaction plans, threshold changes requiring process-owner sign-off, standard work in onboarding, a 30/60/90-day audit, and updated KPIs."}
]},

/* ---------------------------------------------------------------- 11 */
{id:"m11", belt:"green", title:"Leading Change and Deployment", time:"60 min",
summary:"The people side of improvement, A3 thinking, strategy deployment and Lean Six Sigma in digital and agile organisations.",
objectives:[
 "Plan for resistance using ADKAR and Kotter",
 "Write an A3 problem-solving report",
 "Connect projects to strategy with hoshin kanri",
 "Apply Lean Six Sigma alongside automation, BPM and agile ways of working",
 "Build a personal roadmap toward Green Belt certification"],
sections:[
{h:"The people side", html:`
<p>A rough rule many practitioners use: <strong>E = Q × A</strong>. The effectiveness of a change equals the quality of the technical solution times its acceptance. A brilliant solution with zero acceptance delivers zero.</p>
<p><strong>ADKAR</strong> (Prosci) describes what each individual needs to change:</p>
<ul>
<li><strong>A</strong>wareness of why the change is needed</li>
<li><strong>D</strong>esire to support it</li>
<li><strong>K</strong>nowledge of how to change</li>
<li><strong>A</strong>bility to do it in practice</li>
<li><strong>R</strong>einforcement to make it stick</li>
</ul>
<p><strong>Kotter's 8 steps</strong> describe change at the organisation level: create urgency, build a guiding coalition, form a vision, communicate it, empower action and remove obstacles, generate short-term wins, consolidate gains, anchor the change in culture.</p>`},
{h:"Handling resistance", html:`
<ul>
<li>Resistance is information. Ask what people fear losing: control, status, competence, jobs.</li>
<li>Involve the people who do the work early. People support what they help create.</li>
<li>Be explicit about jobs. If productivity frees capacity, say how it will be used (growth, backlog, better service), and keep that promise.</li>
<li>Show data, but tell the customer story too.</li>
<li>Use quick wins to build credibility.</li>
</ul>`},
{h:"A3 thinking", html:`
<p>Toyota's <strong>A3 report</strong> fits a whole problem-solving story on one A3 sheet (about 11 × 17 inches). Writing it forces clear thinking and makes coaching easy.</p>
<div class="tbl"><table>
<tr><th>Left side (understand)</th><th>Right side (act)</th></tr>
<tr><td>1. Background: why this matters<br>2. Current condition: data, map<br>3. Goal / target condition<br>4. Root cause analysis</td><td>5. Countermeasures<br>6. Implementation plan (who, what, when)<br>7. Follow-up: results and next steps</td></tr>
</table></div>
<p>The A3 follows PDCA and is lighter than a full DMAIC deck. It's excellent for smaller problems and for managers coaching their teams.</p>`},
{h:"Strategy deployment: hoshin kanri", html:`
<p><strong>Hoshin kanri</strong> aligns improvement work with strategy. Leadership sets a few breakthrough objectives; each level translates them into its own goals and projects through <strong>catchball</strong>, a back-and-forth dialogue about what's feasible. An <strong>X-matrix</strong> on one page links long-term objectives, annual goals, improvement priorities, metrics and owners.</p>
<p>This prevents the classic failure of Lean Six Sigma programs: lots of small projects with certificates and savings claims that don't add up to anything the CEO cares about.</p>`},
{h:"Lean Six Sigma in a digital world", html:`
<ul>
<li><strong>Process mining</strong> tools reconstruct the real process from system event logs (case ID, activity, timestamp). They show every variant and rework loop, which is a value stream map built from data.</li>
<li><strong>Automation (RPA, workflow, AI)</strong> amplifies whatever process it's applied to. Use Lean Six Sigma first to simplify and standardise.</li>
<li><strong>BPM</strong> (business process management) provides governance: process owners, process architecture and lifecycle management. Lean Six Sigma provides the improvement method.</li>
<li><strong>Agile and Scrum</strong> share Lean roots: small batches, WIP limits, fast feedback, retrospectives (kaizen). DMAIC phases can be run as sprints with tollgates as sprint reviews.</li>
<li><strong>Customer journey mapping</strong> complements process maps: the journey is the outside-in view, the process map the inside-out view.</li>
</ul>`},
{h:"Your path from here", html:`
<ol>
<li>Finish this course and the capstone. Aim for 80%+ on the final exam.</li>
<li>Learn a statistics tool: Minitab, JMP, or free options such as Python (pandas, scipy, statsmodels) or R. Excel with the Analysis ToolPak covers basics.</li>
<li>Lead one real project at work, ideally with a mentor. Most credible Green Belt certifications require a completed project.</li>
<li>Choose a certification body: ASQ (Certified Six Sigma Green Belt), IASSC, or your employer's internal program. Read their body of knowledge to fill gaps.</li>
<li>Keep a portfolio: charter, maps, analysis and control plan for each project, with validated results.</li>
</ol>`}
],
quiz:[
{q:"In ADKAR, the second element is:", o:["Ability","Awareness","Desire","Knowledge"], a:2, why:"Awareness, Desire, Knowledge, Ability, Reinforcement."},
{q:"E = Q × A means:", o:["Efficiency equals quality times automation","Effectiveness of change equals solution quality times acceptance","Effort equals quantity times accuracy","Errors equal quality times attention"], a:1, why:"Acceptance multiplies the technical quality; zero acceptance gives zero results."},

/* Bell-curve path in σ units: cx is the axis zero, sx px per σ, mu shifts the curve */
function curve(cx,base,sx,hy,a,b,mu=0,closed=false){let p="";
  for(let i=0;i<=80;i++){const z=a+(b-a)*i/80;p+=(i?"L":"M")+(cx+z*sx).toFixed(1)+","+(base-hy*npdf(z-mu)).toFixed(1);}
  return closed?p+`L${(cx+b*sx).toFixed(1)},${base}L${(cx+a*sx).toFixed(1)},${base}Z`:p;}

swimlane:()=>{const lanes=["Vendor","AP clerk","Buyer","Approver","Treasury"],cy=i=>39+i*62;let s="";

 const st=[[0,150,"Send invoice"],[1,245,"Scan, index"],[1,340,"3-way match"],[2,440,"Resolve gap"],[3,540,"Approve"],[4,640,"Pay"]];
 st.forEach((p,i)=>{if(!i)return;const a=st[i-1],x1=a[1]+42,x2=p[1]-42,y1=cy(a[0]),y2=cy(p[0]);
  if(y1===y2)s+=`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" class="s-mu" marker-end="url(#ar)"/>`;
  else{const xm=(x1+x2)/2;s+=`<path d="M${x1},${y1}H${xm}V${y2}H${x2}" class="s-mu" marker-end="url(#ar)"/><circle cx="${xm}" cy="${(y1+y2)/2}" r="6" class="s-red"/>`;}});
 s+=`<path d="M440,${cy(2)-17}V${cy(0)}H192" class="s-redl s-dash" marker-end="url(#ar)"/>${tx(300,cy(0)-8,"Rework: request credit note","t-r t-s","middle")}`;
 st.forEach(p=>{s+=`<rect x="${p[1]-42}" y="${cy(p[0])-17}" width="84" height="34" rx="6" class="s-soft"/>${tx(p[1],cy(p[0])+4,p[2],"t-s","middle")}`;});

/* ============================== KEY TERMS ============================== */
const NO_ALIAS=new Set(["sponsor","batch","pull","defect","defective","constraint"]);
const EXTRA_ALIAS={"Pareto principle":["Pareto chart","Pareto"],"Gemba":["Gemba walk"],"Value-added (VA)":["value-added"],"Non-value-added (NVA)":["non-value-added"],"Business-value-added (BVA)":["business-value-added"],"Hypothesis test":["hypothesis testing"]};
let TERM_RE=null;const TERM_MAP={};
function buildTerms(){
  GLOSSARY.forEach(([t],i)=>{const m=t.match(/^(.*?)\s*\(([^)]+)\)$/);let al=m&&!t.startsWith("Y =")?[m[1],m[2]]:t.split(" / ");
    al=al.concat(EXTRA_ALIAS[t]||[]);al.forEach(a=>{a=a.trim();const k=a.toLowerCase();if(a&&!NO_ALIAS.has(k)&&!(k in TERM_MAP))TERM_MAP[k]={i,a};});});
  const keys=Object.values(TERM_MAP).map(v=>v.a).sort((a,b)=>b.length-a.length).map(a=>a.replace(/[.*+?^${}()|[\]\\]/g,"\\$&"));
  TERM_RE=new RegExp(`(?<![\\w-])(${keys.join("|")})(?:s|es|ing)?(?![\\w])`,"gi");
}
function linkTerms(root){
  if(!TERM_RE)buildTerms();const used=new Set();
  root.querySelectorAll(".prose").forEach(pr=>{
    const w=document.createTreeWalker(pr,NodeFilter.SHOW_TEXT,{acceptNode:n=>n.parentElement.closest(".term,.formula,code,a,th,figure,button,h1,h2,h3,h4,.eyebrow")?NodeFilter.FILTER_REJECT:NodeFilter.FILTER_ACCEPT});
    const nodes=[];while(w.nextNode())nodes.push(w.currentNode);
    nodes.forEach(n=>{const txt=n.nodeValue;TERM_RE.lastIndex=0;let m,last=0,frag=null;
      while((m=TERM_RE.exec(txt))){const hit=TERM_MAP[m[1].toLowerCase()];if(!hit||used.has(hit.i))continue;if(hit.a.length<=3&&m[1]!==hit.a)continue;
        used.add(hit.i);frag=frag||document.createDocumentFragment();frag.append(txt.slice(last,m.index));
        const b=document.createElement("button");b.type="button";b.className="term";b.dataset.g=hit.i;b.setAttribute("aria-expanded","false");b.textContent=m[0];frag.append(b);last=m.index+m[0].length;}
      if(frag){frag.append(txt.slice(last));n.replaceWith(frag);}});
  });
}

function showPop(b,pin){const [t,d]=GLOSSARY[+b.dataset.g];pop.innerHTML=`<b>${esc(t)}</b>${esc(d)}`;pop.hidden=false;
  if(popFor&&popFor!==b)popFor.setAttribute("aria-expanded","false");popFor=b;pinned=!!pin;b.setAttribute("aria-expanded","true");
  const r=b.getBoundingClientRect(),pw=pop.offsetWidth,ph=pop.offsetHeight;let x=Math.min(Math.max(12,r.left+r.width/2-pw/2),innerWidth-pw-12),y=r.bottom+8;if(y+ph>innerHeight-8)y=r.top-ph-8;
  pop.style.left=x+"px";pop.style.top=Math.max(8,y)+"px";}
function hidePop(){pop.hidden=true;pinned=false;if(popFor)popFor.setAttribute("aria-expanded","false");popFor=null;}
document.addEventListener("mouseover",e=>{const b=e.target.closest&&e.target.closest(".term");if(b&&!pinned)showPop(b);});
document.addEventListener("mouseout",e=>{const b=e.target.closest&&e.target.closest(".term");if(b&&!pinned&&!b.contains(e.relatedTarget))hidePop();});
document.addEventListener("focusin",e=>{if(e.target.classList&&e.target.classList.contains("term"))showPop(e.target);});
document.addEventListener("focusout",e=>{if(e.target.classList&&e.target.classList.contains("term")&&!pinned)hidePop();});
document.addEventListener("click",e=>{const b=e.target.closest&&e.target.closest(".term");
  if(b){e.preventDefault();if(pinned&&popFor===b)hidePop();else showPop(b,true);}else if(!pop.contains(e.target))hidePop();});
document.addEventListener("keydown",e=>{if(e.key==="Escape")hidePop();});

function wireQuiz(root,qs,id){
  let answered=0,correct=0;
  const upd=()=>{root.querySelector(".score").textContent=`${answered}/${qs.length} answered · ${correct} correct`;
    if(answered===qs.length){const pct=Math.round(correct/qs.length*100);
      if(!(state.best[id]>=pct)){state.best[id]=pct;save();}
      root.querySelector(".score").textContent+=` · ${pct}% (best ${state.best[id]}%)`;}};
  root.querySelectorAll(".qcard").forEach(card=>{
    const q=qs[+card.dataset.q];
    card.querySelectorAll(".opt").forEach(b=>b.addEventListener("click",()=>{
      const pick=+b.dataset.o; answered++; if(pick===q.a) correct++;
      card.querySelectorAll(".opt").forEach(x=>{x.disabled=true;const k=+x.dataset.o;
        if(k===q.a)x.classList.add("right"); else if(k===pick)x.classList.add("wrong");});
      const w=card.querySelector(".why"); w.hidden=false;
      w.className="why "+(pick===q.a?"ok":"no");
      w.innerHTML=`<b>${pick===q.a?"Correct.":"Not quite. Answer: "+L[q.a]+"."}</b> ${esc(q.why)}`;
      upd();
    }));
  });
  root.querySelector(".reset").addEventListener("click",()=>{root.querySelector(".qlist").innerHTML=quizHTML(qs);wireQuiz(root,qs,id);});
  upd();
}

function wireExam(){
  const picks={};
  const cnt=()=>$("#examCount").textContent=`${Object.keys(picks).length}/${EXAM.length} answered`;
  document.querySelectorAll("#examList .qcard").forEach(card=>{

    if(missing>0 && !$("#submitExam").dataset.confirm){
      $("#submitExam").dataset.confirm="1";$("#submitExam").textContent=`${missing} unanswered. Submit anyway?`;return;}
    let c=0;
    document.querySelectorAll("#examList .qcard").forEach(card=>{

  $("#resetExam").addEventListener("click",()=>route(true));

function normInv(p){
  const a=[-39.69683028665376,220.9460984245205,-275.9285104469687,138.357751867269,-30.66479806614716,2.506628277459239],
  b=[-54.47609879822406,161.5858368580409,-155.6989798598866,66.80131188771972,-13.28068155288572],
  c=[-0.007784894002430293,-0.3223964580411365,-2.400758277161838,-2.549732539343734,4.374664141464968,2.938163982698783],
  d=[0.007784695709041462,0.3224671290700398,2.445134137142996,3.754408661907416],pl=0.02425;let q,r;
  if(p<pl){q=Math.sqrt(-2*Math.log(p));return(((((c[0]*q+c[1])*q+c[2])*q+c[3])*q+c[4])*q+c[5])/((((d[0]*q+d[1])*q+d[2])*q+d[3])*q+1);}
  if(p<=1-pl){q=p-0.5;r=q*q;return(((((a[0]*r+a[1])*r+a[2])*r+a[3])*r+a[4])*r+a[5])*q/(((((b[0]*r+b[1])*r+b[2])*r+b[3])*r+b[4])*r+1);}
  q=Math.sqrt(-2*Math.log(1-p));return-(((((c[0]*q+c[1])*q+c[2])*q+c[3])*q+c[4])*q+c[5])/((((d[0]*q+d[1])*q+d[2])*q+d[3])*q+1);
}
function wireToolkit(){
  const v=id=>{const x=$("#"+id).value.trim();return x===""?null:parseFloat(x);};
  const fmt=(n,d=2)=>isFinite(n)?n.toLocaleString(undefined,{maximumFractionDigits:d}):"–";
  const calc=()=>{
    const D=v("t-def"),U=v("t-units"),O=v("t-opp");
    if(D!=null&&U>0&&O>0){const dpo=D/(U*O),dpmo=dpo*1e6;let s=dpo<=0?"> 6":dpo>=1?"< 0":fmt(normInv(1-dpo)+1.5,2);
      $("#o-sigma").innerHTML=`<span>DPU <b>${fmt(D/U,4)}</b></span><span>DPMO <b>${fmt(dpmo,0)}</b></span><span>Yield <b>${fmt((1-dpo)*100,3)}%</b></span><span>Sigma level (1.5σ shift) <b>${s}</b></span>`;}
    else $("#o-sigma").textContent="Enter defects, units and opportunities.";
    const A=v("t-avail"),De=v("t-dem"),W=v("t-work");
    if(A>0&&De>0){const t=A/De;$("#o-takt").innerHTML=`<span>Takt <b>${fmt(t)} min per unit</b></span>${W>0?`<span>Minimum people <b>${fmt(W/t)}</b> → round up to <b>${Math.ceil(W/t-1e-9)}</b></span>`:""}`;}
    else $("#o-takt").textContent="Enter available time and demand.";
    const Wi=v("t-wip"),T=v("t-thr");
    $("#o-little").innerHTML=Wi!=null&&T>0?`<span>Average lead time <b>${fmt(Wi/T)} days</b></span>`:"Enter WIP and throughput.";
    const LS=v("t-lsl"),US=v("t-usl"),M=v("t-mean"),S=v("t-sd");
    if(M!=null&&S>0&&(LS!=null||US!=null)){let out="";
      if(LS!=null&&US!=null)out+=`<span>Cp <b>${fmt((US-LS)/(6*S))}</b></span>`;
      const cu=US!=null?(US-M)/(3*S):Infinity,cl=LS!=null?(M-LS)/(3*S):Infinity,k=Math.min(cu,cl);
      if(US!=null)out+=`<span>Cpu <b>${fmt(cu)}</b></span>`; if(LS!=null)out+=`<span>Cpl <b>${fmt(cl)}</b></span>`;
      out+=`<span>Cpk <b>${fmt(k)}</b> · ${k<1?"not capable":k<1.33?"marginal":"capable"}</span>`;$("#o-cap").innerHTML=out;}
    else $("#o-cap").textContent="Enter the mean, a standard deviation above 0, and at least one spec limit.";
    const VA=v("t-va"),LT=v("t-lt");
    $("#o-pce").innerHTML=VA!=null&&LT>0?`<span>PCE <b>${fmt(VA/LT*100)}%</b></span><span>Non-value-added time <b>${fmt(LT-VA)} h</b></span>`:"Enter value-added time and lead time.";
    const ys=$("#t-fpy").value.split(",").map(s=>parseFloat(s)).filter(x=>isFinite(x));
    $("#o-rty").innerHTML=ys.length?`<span>Steps <b>${ys.length}</b></span><span>RTY <b>${fmt(ys.reduce((a,b)=>a*b/100,100))}%</b></span>`:"Enter at least one yield.";
  };
  document.querySelectorAll(".tool input").forEach(i=>i.addEventListener("input",calc));calc();
}

/* ============================== ROUTER ============================== */
function setCurrent(id){
  document.querySelectorAll("#nav a").forEach(a=>{if(a.dataset.id===id)a.setAttribute("aria-current","page");else a.removeAttribute("aria-current");});}
function route(keepScroll){
  const id=(location.hash||"#home").slice(1);
  const v=$("#view");const mi=MODULES.findIndex(m=>m.id===id);
  if(mi>=0){const m=MODULES[mi];v.innerHTML=viewModule(m,mi);wireQuiz($("#quiz"),m.quiz,m.id);wireDone(m.id);}
  else if(id==="capstone"){v.innerHTML=viewCapstone();wireDone("capstone");}
  else if(id==="exam"){v.innerHTML=viewExam();wireExam();}
  else if(id==="toolkit"){v.innerHTML=viewToolkit();wireToolkit();}
  else if(id==="glossary"){v.innerHTML=viewGlossary();wireGlossary();}
  else {v.innerHTML=viewHome();}
  hidePop();if(mi>=0||id==="capstone")linkTerms(v);
  const cur=PAGES.some(p=>p.id===id)?id:"home";
  setCurrent(cur);document.title="Lean Six Sigma Path";
  $("#side").classList.remove("open");$("#menuBtn").setAttribute("aria-expanded","false");
  if(keepScroll!==true)window.scrollTo(0,0);
}
$("#menuBtn").addEventListener("click",()=>{const o=$("#side").classList.toggle("open");$("#menuBtn").setAttribute("aria-expanded",o);});
window.addEventListener("hashchange",route);
$("#themeBtn").addEventListener("click",()=>{const n=curTheme()==="dark"?"light":"dark";ROOT.dataset.theme=n;try{localStorage.setItem("lss-theme",n);}catch(e){}paintThemeBtn();});

paintThemeBtn();
renderNav();route();

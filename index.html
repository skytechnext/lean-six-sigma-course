<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Lean Six Sigma Path</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: sticky belt-path sidebar + a single reading column; modules render into the column by hash. */
:root{
  --bg:#f3f5f7; --surface:#ffffff; --sunk:#e9edf1; --ink:#15212c; --muted:#56646f; --line:#d6dde4;
  --accent:#0d6b73; --accent-ink:#ffffff; --accent-soft:#dcefef;
  --ok:#1d7446; --ok-soft:#dff2e6; --bad:#b0352c; --bad-soft:#f8e1de;
  --belt-white:#c9d2da; --belt-yellow:#d9a514; --belt-green:#2e8a4f; --belt-black:#1b2026;
  --ucl:#b0352c;
  --display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body:"IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, Consolas, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1419; --surface:#151e26; --sunk:#1b2630; --ink:#e2e8ee; --muted:#93a1ae; --line:#28343f;
  --accent:#55c2c9; --accent-ink:#06282b; --accent-soft:#16363a;
  --ok:#5fcf8c; --ok-soft:#163626; --bad:#f08a80; --bad-soft:#3d1d1a;
  --belt-white:#8794a0; --belt-yellow:#e9b934; --belt-green:#4fb873; --belt-black:#cfd6dc;
  --ucl:#f08a80; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0e1419; --surface:#151e26; --sunk:#1b2630; --ink:#e2e8ee; --muted:#93a1ae; --line:#28343f;
  --accent:#55c2c9; --accent-ink:#06282b; --accent-soft:#16363a;
  --ok:#5fcf8c; --ok-soft:#163626; --bad:#f08a80; --bad-soft:#3d1d1a;
  --belt-white:#8794a0; --belt-yellow:#e9b934; --belt-green:#4fb873; --belt-black:#cfd6dc;
  --ucl:#f08a80; color-scheme:dark;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.6}
h1,h2,h3,h4{font-family:var(--display);line-height:1.15;text-wrap:balance;margin:0}
h1{font-size:clamp(2rem,5vw,2.9rem);font-weight:800;letter-spacing:-.02em}
h2{font-size:1.6rem;font-weight:700;letter-spacing:-.01em}
h3{font-size:1.2rem;font-weight:700}
h4{font-size:1rem;font-weight:700}
p{margin:0}
a{color:var(--accent)}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
code,.mono{font-family:var(--mono);font-size:.9em}
.eyebrow{font-family:var(--mono);font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}

.app{display:grid;grid-template-columns:290px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;overflow-y:auto;border-right:1px solid var(--line);background:var(--surface);
  padding-block:24px;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:20px;display:flex;flex-direction:column;gap:18px}
.brand{display:flex;flex-direction:column;gap:4px}
.brand b{font-family:var(--display);font-size:1.35rem;font-weight:800;letter-spacing:-.01em}
.overall{display:flex;flex-direction:column;gap:6px}
.bar{height:6px;border-radius:3px;background:var(--sunk);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);width:0;transition:width .3s}
.nav{display:flex;flex-direction:column;gap:2px}
.nav .grp{margin-top:10px;margin-bottom:4px}
.nav a{display:grid;grid-template-columns:14px minmax(0,1fr) auto;gap:10px;align-items:center;padding:7px 10px;border-radius:7px;
  color:var(--ink);text-decoration:none;font-size:.93rem;line-height:1.3}
.nav a:hover{background:var(--sunk)}
.nav a[aria-current="page"]{background:var(--accent-soft);font-weight:600}
.belt{width:14px;height:5px;border-radius:2px;background:var(--belt-white)}
.belt.yellow{background:var(--belt-yellow)} .belt.green{background:var(--belt-green)} .belt.black{background:var(--belt-black)}
.tick{font-family:var(--mono);font-size:.75rem;color:var(--ok)}
.menu-btn{display:none}

main{padding-block:40px 80px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.col{max-width:780px;margin:0 auto;display:flex;flex-direction:column;gap:28px}
.lede{font-size:1.12rem;color:var(--muted);max-width:62ch}
.prose{display:flex;flex-direction:column;gap:14px}
.prose>p,.prose>ul,.prose>ol{max-width:68ch}
.brand-row{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.theme-btn{padding:8px 10px;justify-content:center;gap:6px}
.theme-btn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2}

/* Diagrams */
.fig{margin:0;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;overflow-x:auto;display:flex;flex-direction:column;gap:10px}
.fig>svg{display:block;width:100%;height:auto}
.fig figcaption{font-size:.85rem;color:var(--muted);line-height:1.45}
.fig svg text{fill:var(--ink);font-family:var(--body);font-size:12px}
.fig svg .t-m{fill:var(--muted)} .fig svg .t-a{fill:var(--accent)} .fig svg .t-r{fill:var(--ucl)}
.fig svg .t-s{font-size:10.5px} .fig svg .t-b{font-weight:600} .fig svg .t-mono{font-family:var(--mono)} .fig svg .t-l{font-size:15px}
.s-box{fill:var(--surface);stroke:var(--line)} .s-bg{fill:var(--bg);stroke:var(--line)} .s-sunk{fill:var(--sunk)}
.s-soft{fill:var(--accent-soft);stroke:var(--accent)} .s-acc{fill:var(--accent)} .s-accl{stroke:var(--accent);fill:none;stroke-width:2}
.s-ln{stroke:var(--line);fill:none} .s-mu{stroke:var(--muted);fill:none;stroke-width:1.4} .s-ink{stroke:var(--ink);fill:none;stroke-width:1.6}
.s-red{fill:var(--ucl)} .s-redl{stroke:var(--ucl);fill:none;stroke-width:1.6} .s-yel{fill:var(--belt-yellow)} .s-yell{stroke:var(--belt-yellow);fill:none;stroke-width:2.2}
.s-grn{fill:var(--belt-green)} .s-dash{stroke-dasharray:5 4} .mk{fill:var(--muted)} .s-inkf{fill:var(--ink)}
.flow{display:flex;flex-wrap:wrap;gap:6px;align-items:stretch}
.flow .st{flex:1 1 110px;min-width:0;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--bg);display:flex;flex-direction:column;gap:2px;font-size:.84rem;line-height:1.35}
.flow .st.hl{background:var(--accent-soft);border-color:var(--accent)}
.flow .st small{color:var(--muted);font-size:.78rem}
.flow .arrow{display:flex;flex-direction:column;justify-content:center;align-items:center;color:var(--muted);font-size:1.1rem;flex:none}
.flow .arrow small{font-size:.68rem;color:var(--ucl);font-family:var(--mono);white-space:nowrap}
.flow .arrow .ar{font-style:normal}
.flow .arrow .ar::before{content:"→"}
.house{display:flex;flex-direction:column;gap:6px;max-width:560px;width:100%;margin:0 auto;text-align:center;font-size:.85rem;line-height:1.35}
.house .roof{background:var(--accent);color:var(--accent-ink);clip-path:polygon(50% 0,100% 100%,0 100%);padding:44px 16% 12px;font-weight:600}
.house .pillars{display:grid;grid-template-columns:1fr 1.25fr 1fr;gap:6px}
.house .pillars>div{border:1px solid var(--line);border-radius:6px;padding:14px 8px;display:flex;flex-direction:column;gap:4px;background:var(--bg)}
.house .pillars>.pillar{background:var(--accent-soft);border-color:var(--accent)}
.house .pillars span,.house .base span{color:var(--muted);font-size:.78rem}
.house .base{background:var(--sunk);border-radius:6px;padding:8px;display:flex;flex-direction:column;gap:2px}
.wgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.wgrid>div{border:1px solid var(--line);border-radius:8px;padding:10px;background:var(--bg);display:flex;flex-direction:column;gap:2px;font-size:.82rem;line-height:1.35}
.wgrid b{font-family:var(--display);font-size:1.7rem;color:var(--accent);line-height:1}
.wgrid span{font-weight:600} .wgrid small{color:var(--muted)}
.stack{display:flex;height:34px;border-radius:6px;overflow:hidden;border:1px solid var(--line)}
.stack>i{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:.82rem;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:12px;height:12px;border-radius:3px;display:inline-block}
.c-acc{background:var(--accent)} .c-yel{background:var(--belt-yellow)} .c-sunk{background:var(--sunk)} .c-red{background:var(--ucl)} .c-grn{background:var(--belt-green)}
.kb{display:grid;grid-template-columns:repeat(5,minmax(104px,1fr));gap:8px;min-width:560px}
.kb>div{background:var(--sunk);border-radius:8px;padding:8px;display:flex;flex-direction:column;gap:6px;font-size:.8rem}
.kb>div.full{outline:2px solid var(--belt-yellow);outline-offset:-2px}
.kb h5{margin:0;font-size:.78rem;display:flex;justify-content:space-between;gap:6px;font-family:var(--mono);font-weight:500;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.kb .card{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:6px 8px;line-height:1.3}
.ladder{display:flex;flex-direction:column;align-items:center;gap:4px}
.ladder>div{border:1px solid var(--accent);border-radius:6px;padding:8px 12px;text-align:center;font-size:.85rem;line-height:1.35;display:flex;flex-direction:column;gap:2px;max-width:100%}
.ladder>div small{color:var(--muted)}
.ladder-ends{display:flex;justify-content:space-between;font-family:var(--mono);font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.quad{display:grid;grid-template-columns:auto minmax(0,1fr);grid-template-rows:minmax(0,1fr) auto;gap:6px}
.quad .qy{writing-mode:vertical-rl;transform:rotate(180deg);font-family:var(--mono);font-size:.72rem;color:var(--muted);text-align:center;text-transform:uppercase;letter-spacing:.06em}
.quad .qx{grid-column:2;font-family:var(--mono);font-size:.72rem;color:var(--muted);text-align:center;text-transform:uppercase;letter-spacing:.06em}
.qgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.qgrid>div{border:1px solid var(--line);border-radius:8px;padding:10px;background:var(--bg);display:flex;flex-direction:column;gap:6px;font-size:.84rem;min-height:92px}
.qgrid>div.hot{background:var(--accent-soft);border-color:var(--accent)}
.qgrid small{color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chips>span{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:2px 8px;font-size:.76rem}
.a3{border:1px solid var(--line);border-radius:6px;background:var(--bg);display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1px;overflow:hidden}
.a3 .a3h{grid-column:1/-1;background:var(--sunk);padding:8px 12px;font-size:.84rem;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.a3 .col2{display:flex;flex-direction:column;gap:1px;background:var(--line)}
.a3 .col2>div{background:var(--surface);padding:8px 12px;font-size:.8rem;display:flex;flex-direction:column;gap:2px}
.a3 .col2 small{color:var(--muted)}
.ctree{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.ctree>div{border:1px solid var(--line);border-radius:8px;background:var(--bg);padding:10px;display:flex;flex-direction:column;gap:6px;font-size:.84rem}
.ctree .r{display:flex;justify-content:space-between;gap:8px;border-top:1px dashed var(--line);padding-top:6px}
.ctree .r b{font-family:var(--mono);color:var(--accent);font-weight:500;white-space:nowrap}

/* Key-term definitions */
.term{background:none;border:0;padding:0;margin:0;font:inherit;color:inherit;line-height:inherit;text-align:inherit;border-bottom:1.5px dotted var(--accent);cursor:help;border-radius:0}
.term:hover,.term[aria-expanded="true"]{color:var(--accent)}
#pop{position:fixed;z-index:50;max-width:min(320px,calc(100vw - 32px));background:var(--ink);color:var(--bg);padding:10px 12px;border-radius:8px;font-size:.88rem;line-height:1.45;box-shadow:0 8px 24px rgb(0 0 0 / .22)}
#pop b{display:block;margin-bottom:2px;font-family:var(--display)}
#pop a{color:inherit;font-size:.8rem;opacity:.8}
.prose ul,.prose ol{margin:0;padding-left:1.3em;display:flex;flex-direction:column;gap:6px}
.prose strong{font-weight:600}
section.lesson{display:flex;flex-direction:column;gap:14px;padding-top:6px}
section.lesson>h3{display:flex;gap:10px;align-items:baseline}
section.lesson>h3 .n{font-family:var(--mono);font-size:.8rem;color:var(--muted);font-weight:500}
hr.rule{border:0;border-top:1px solid var(--line);margin:0}

.head{display:flex;flex-direction:column;gap:14px}
.meta{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:7px;padding:3px 10px;border:1px solid var(--line);border-radius:999px;font-size:.8rem;color:var(--muted);background:var(--surface)}
.obj{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px 20px;display:flex;flex-direction:column;gap:10px}
.obj ul{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:4px}

.callout{border-left:3px solid var(--accent);background:var(--accent-soft);padding:14px 16px;border-radius:0 8px 8px 0;display:flex;flex-direction:column;gap:6px}
.callout.example{border-left-color:var(--belt-yellow);background:var(--sunk)}
.callout .eyebrow{color:var(--ink);opacity:.75}
.formula{font-family:var(--mono);background:var(--sunk);border-radius:8px;padding:12px 14px;font-size:.92rem;overflow-x:auto;white-space:pre}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:.92rem}
th,td{padding:9px 12px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
th{font-family:var(--mono);font-size:.74rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:500;background:var(--sunk)}
tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;font-family:var(--mono)}

.dmaic{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.dmaic>div{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:6px;font-size:.85rem}
.dmaic b{font-family:var(--display);font-size:1.6rem;color:var(--accent);line-height:1}
.dmaic .q{font-weight:600}
.dmaic .t{color:var(--muted)}
.chart{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px;overflow-x:auto}
.chart svg{display:block;width:100%;min-width:520px;height:auto}

/* Quiz */
.block{display:flex;flex-direction:column;gap:14px}
.block-head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.score{font-family:var(--mono);font-size:.85rem;color:var(--muted);font-variant-numeric:tabular-nums}
.qcard{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px 18px;display:flex;flex-direction:column;gap:12px}
.qcard .qt{font-weight:600;display:flex;gap:10px}
.qcard .qt .n{font-family:var(--mono);color:var(--muted);font-weight:500;flex:none}
.opts{display:flex;flex-direction:column;gap:6px}
.opt{text-align:left;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 12px;display:flex;gap:10px;line-height:1.4}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt .k{font-family:var(--mono);color:var(--muted);flex:none}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt:disabled{cursor:default}
.why{font-size:.92rem;padding:10px 12px;border-radius:8px;background:var(--sunk)}
.why b{font-weight:600}
.why.ok b{color:var(--ok)} .why.no b{color:var(--bad)}
details.oq{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 18px}
details.oq>summary{cursor:pointer;font-weight:600;list-style:none;display:flex;gap:10px}
details.oq>summary::-webkit-details-marker{display:none}
details.oq>summary .n{font-family:var(--mono);color:var(--muted);font-weight:500;flex:none}
details.oq .ans{margin-top:12px;padding-top:12px;border-top:1px dashed var(--line);display:flex;flex-direction:column;gap:8px;font-size:.95rem}
details.oq textarea{width:100%;min-height:80px;margin-top:12px;font:inherit;font-size:.92rem;padding:10px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);resize:vertical}
.reveal-hint{font-size:.8rem;color:var(--muted);font-family:var(--mono)}

.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 14px;font-weight:500}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.pager{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;padding-top:8px;border-top:1px solid var(--line)}
.pager a{text-decoration:none;display:flex;flex-direction:column;gap:2px;padding:10px 14px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);max-width:48%}
.pager a span{font-size:.75rem;color:var(--muted);font-family:var(--mono)}

/* Home */
.path{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.mod{display:flex;flex-direction:column;gap:8px;padding:14px 16px;border:1px solid var(--line);border-radius:10px;background:var(--surface);text-decoration:none;color:var(--ink)}
.mod{transition:border-color .2s,transform .2s}
.mod:hover{border-color:var(--accent);transform:translateY(-2px)}
.btn,.opt,.nav a{transition:border-color .2s,background-color .2s;min-height:44px}
.btn{display:inline-flex;align-items:center}
.mod .top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.mod h4{font-size:1rem}
.mod p{font-size:.86rem;color:var(--muted);line-height:1.45}
.belts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.belts>div{border:1px solid var(--line);border-radius:10px;padding:14px;background:var(--surface);display:flex;flex-direction:column;gap:6px;font-size:.9rem}
.belts .belt{width:40px;height:8px}

/* Toolkit */
.tools{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.tool{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:10px}
.tool label{display:flex;flex-direction:column;gap:3px;font-size:.82rem;color:var(--muted)}
.tool input{font:inherit;font-family:var(--mono);font-size:.95rem;padding:7px 9px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);width:100%}
.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.out{font-family:var(--mono);font-size:.9rem;background:var(--sunk);border-radius:8px;padding:10px 12px;display:flex;flex-direction:column;gap:3px;font-variant-numeric:tabular-nums}
.out b{color:var(--accent);font-weight:500}
.search{font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);width:100%}
dl.gl{margin:0;display:flex;flex-direction:column}
dl.gl>div{padding:10px 0;border-bottom:1px solid var(--line);display:grid;grid-template-columns:200px minmax(0,1fr);gap:14px}
dl.gl dt{font-weight:600}
dl.gl dd{margin:0;color:var(--muted)}
.result{padding:18px 20px;border-radius:10px;border:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;gap:6px}
.result .big{font-family:var(--display);font-size:2.4rem;font-weight:800;font-variant-numeric:tabular-nums}

@media (max-width:900px){
  .app{grid-template-columns:minmax(0,1fr)}

<script>
/* ============================== CONTENT ============================== */
const MODULES = [
/* ---------------------------------------------------------------- 1 */
{id:"m1", belt:"white", title:"Foundations of Lean Six Sigma", time:"45 min",
summary:"Where Lean and Six Sigma came from, what each one fixes, and why businesses combine them.",
objectives:[
 "Explain Lean and Six Sigma in one sentence each",
 "Describe what a business process is and why optimising processes beats blaming people",
 "Name the main roles and belt levels in a Lean Six Sigma program",
 "Distinguish speed problems (Lean) from variation and defect problems (Six Sigma)"],
sections:[
{h:"What is a business process?", html:`
<p>A <strong>process</strong> is a repeatable set of steps that turns inputs into outputs for a customer. Hiring a new employee, approving an invoice, onboarding a client, resolving a support ticket and shipping an order are all processes. Most of a company's cost, delay and customer frustration lives inside these everyday processes, not in one-off events.</p>
<p>W. Edwards Deming put it bluntly: most problems come from the system, not the people working in it. Lean Six Sigma starts from that assumption. When an invoice is paid late, the question is "what about the process allowed this?" rather than "who messed up?"</p>
<div class="callout"><span class="eyebrow">Key idea</span><p>Every process has a customer (internal or external), a purpose, inputs, steps, outputs and measurable performance. If you can't name the customer, you can't define value.</p></div>`},
{h:"Lean in one sentence", html:`
<p><strong>Lean</strong> is a way of delivering more value to customers with less waste by making work flow smoothly from request to delivery.</p>
<p>Lean grew out of the <strong>Toyota Production System (TPS)</strong>, developed by Taiichi Ohno and Eiji Toyoda from the 1940s to the 1970s. TPS rests on two pillars: <strong>Just-in-Time</strong> (make only what is needed, when it is needed) and <strong>Jidoka</strong> (build in quality by stopping when something goes wrong). The term "Lean" was popularised in 1990 by <em>The Machine That Changed the World</em> (Womack, Jones and Roos) and in 1996 by <em>Lean Thinking</em>.</p>
<p>Lean's main question: <em>how long does it take, and how much of that time adds value?</em></p>`},
{h:"Six Sigma in one sentence", html:`
<p><strong>Six Sigma</strong> is a data-driven method for reducing variation and defects so a process produces the right result consistently.</p>
<p>It was developed at <strong>Motorola</strong> in 1986 (engineer Bill Smith is usually credited) and became famous when Jack Welch made it a company-wide strategy at <strong>General Electric</strong> in 1995. "Sigma" (σ) is the statistical symbol for standard deviation. A process running at "six sigma" produces about <strong>3.4 defects per million opportunities</strong>.</p>
<p>Six Sigma's main question: <em>how often do we get it wrong, and why?</em></p>`},
{h:"Why combine them?", html:`
<p>Lean is fast but can be imprecise: it removes delay and waste, but it doesn't always explain why a result varies. Six Sigma is precise but can be slow: statistical analysis on a process full of obvious waste wastes effort. Together they cover both speed and quality.</p>
<div class="tbl"><table>
<tr><th></th><th>Lean</th><th>Six Sigma</th></tr>
<tr><td>Main enemy</td><td>Waste and delay</td><td>Variation and defects</td></tr>
<tr><td>Core question</td><td>Where does time go?</td><td>Why does the result vary?</td></tr>
<tr><td>Typical tools</td><td>Value stream map, 5S, kanban, kaizen</td><td>DMAIC, statistics, control charts</td></tr>
<tr><td>Pace</td><td>Days to weeks (kaizen events)</td><td>Weeks to months (projects)</td></tr>
<tr><td>Measure of success</td><td>Lead time, flow, productivity</td><td>Defect rate, capability, sigma level</td></tr>
</table></div>
<p>In practice: use Lean to strip out the obvious waste first, then use Six Sigma on the problems that remain stubborn and data-heavy.</p>`},
{h:"Roles and belts", html:`
<p>Lean Six Sigma programs borrow martial-arts belts to describe skill levels. They are not legally standardised; bodies like ASQ and IASSC each publish their own bodies of knowledge.</p>
<div class="tbl"><table>
<tr><th>Role</th><th>What they do</th></tr>
<tr><td>Executive sponsor / Champion</td><td>Chooses projects that matter to strategy, removes roadblocks, provides resources</td></tr>
<tr><td>Process owner</td><td>Owns the process day to day and keeps the improvement in place after the project ends</td></tr>
<tr><td>Master Black Belt</td><td>Coach and trainer; guides the program and reviews complex analysis</td></tr>
<tr><td>Black Belt</td><td>Full-time project leader on complex, cross-functional projects</td></tr>
<tr><td>Green Belt</td><td>Leads smaller projects part-time while doing their normal job. <em>This course takes you toward this level.</em></td></tr>
<tr><td>Yellow Belt</td><td>Team member who understands the basics and contributes data and ideas</td></tr>
<tr><td>White Belt</td><td>Awareness of the concepts and vocabulary</td></tr>
</table></div>`},
{h:"Where it works in business", html:`
<p>Lean Six Sigma started in factories but most of today's opportunities are in <strong>transactional and service processes</strong>: finance, HR, sales operations, customer service, healthcare administration, IT service management, procurement and logistics. These processes are often invisible (work sits in inboxes and queues, not on a shop floor), which is exactly why they hide so much waste.</p>
<div class="callout example"><span class="eyebrow">Business example</span><p>A bank's mortgage approval took 32 days. Applicants spent less than 4 hours in actual review; the rest was waiting for documents, hand-offs between teams, and rework when forms were incomplete. A Lean Six Sigma project that added a completeness check at intake and parallelised two review steps cut the lead time to 11 days.</p></div>`}
],
quiz:[
{q:"Which statement best describes Lean?", o:["A statistical method to reach 3.4 defects per million","A way to deliver more customer value with less waste by improving flow","A software tool for process automation","A quality inspection technique"], a:1, why:"Lean focuses on value and flow. The 3.4 DPMO target belongs to Six Sigma."},
{q:"Six Sigma was first developed at:", o:["Toyota","Ford","Motorola","General Electric"], a:2, why:"Motorola developed Six Sigma in 1986. GE made it famous from 1995 under Jack Welch."},
{q:"What does the Greek letter sigma (σ) represent in statistics?", o:["The mean","Standard deviation","The median","The defect count"], a:1, why:"Sigma is standard deviation, a measure of how spread out results are."},
{q:"A process running at six sigma produces about how many defects per million opportunities?", o:["3.4","34","233","6,210"], a:0, why:"3.4 DPMO (with the conventional 1.5σ long-term shift). 233 is five sigma; 6,210 is four sigma."},
{q:"The two pillars of the Toyota Production System are:", o:["Kaizen and Kanban","Just-in-Time and Jidoka","DMAIC and PDCA","Takt and Flow"], a:1, why:"Just-in-Time (produce what's needed when it's needed) and Jidoka (build in quality, stop on abnormality)."},
{q:"Who usually ensures an improvement is sustained after the project team disbands?", o:["The Black Belt","The Master Black Belt","The process owner","The Yellow Belt"], a:2, why:"The process owner runs the process day to day, so they own the control plan after handover."},
{q:"A customer service process has wildly inconsistent resolution quality. Which approach is the stronger first fit?", o:["Lean, because the issue is speed","Six Sigma, because the issue is variation in the result","Neither, it's a people problem","5S, because the desk is messy"], a:1, why:"Inconsistent output is a variation problem, which is Six Sigma's specialty. You'd still look for waste along the way."},
{q:"Deming's view that most problems come from the system leads Lean Six Sigma practitioners to:", o:["Replace underperforming staff first","Ask what in the process allowed the problem","Add more inspectors","Increase targets"], a:1, why:"Focus on the process, not blame. Blame hides root causes and discourages reporting."}
],
questions:[
{q:"Pick a process you use at work or in daily life. Name its customer, inputs, outputs and one measure of how well it performs.", model:"Example: Expense reimbursement. Customer: the employee who paid. Inputs: receipts, expense form, policy rules, approver time. Outputs: reimbursement paid into the employee's account. Measures: days from submission to payment; percentage of claims returned for correction."},
{q:"Explain to a sceptical manager, in three sentences, why Lean and Six Sigma are stronger together than apart.", model:"Lean removes waste and delay quickly, so we stop analysing steps that shouldn't exist. Six Sigma then uses data to fix the defects and variation that Lean alone can't explain. The result is a process that is both fast and reliable, and the gains are held in place with measurement and control."},
{q:"Why do service and office processes often contain more waste than factory processes?", model:"Office work is largely invisible: it waits in inboxes, queues and shared drives, so nobody sees the pile-ups the way they'd see stacked inventory on a factory floor. Hand-offs between departments are rarely mapped, ownership of the end-to-end process is unclear, and performance is often measured per department rather than from the customer's point of view."}
]},

/* ---------------------------------------------------------------- 2 */
{id:"m2", belt:"white", title:"Lean Thinking and the 8 Wastes", time:"60 min",
summary:"The five Lean principles, value from the customer's point of view, and how to spot the 8 wastes in office work.",
objectives:[
 "Apply the five Lean principles to a business process",
 "Classify steps as value-added, business-value-added or non-value-added",
 "Identify all 8 wastes (DOWNTIME) in transactional processes",
 "Explain muda, mura and muri and how they interact"],
sections:[
{h:"The five Lean principles", html:`
<p>Womack and Jones summarised Lean into five principles that work as a cycle:</p>
<ol>
<li><strong>Value</strong>: define value from the customer's point of view. What would they pay for?</li>
<li><strong>Value stream</strong>: map every step that delivers that value, from request to delivery, across departments.</li>
<li><strong>Flow</strong>: make the remaining steps flow without interruptions, queues or batches.</li>
<li><strong>Pull</strong>: produce or process only when the next step (or customer) asks for it.</li>
<li><strong>Perfection</strong>: repeat. Each cycle reveals more waste to remove.</li>
</ol>`},
{h:"Value-added or not?", html:`
<p>A step is <strong>value-added (VA)</strong> only if all three are true:</p>
<ul>
<li>The customer cares about it (would pay for it).</li>
<li>It physically or informationally changes the product or service.</li>
<li>It is done right the first time.</li>
</ul>
<p><strong>Business-value-added (BVA)</strong> steps don't satisfy the customer directly but are required, for example by law, audit or risk control (a KYC check in banking, tax calculation on an invoice). Minimise them; don't remove them blindly.</p>
<p><strong>Non-value-added (NVA)</strong> steps are pure waste: waiting, re-entering data, chasing approvals, correcting errors. Eliminate them.</p>
<div class="callout"><span class="eyebrow">Reality check</span><p>In typical office processes, value-added time is often below 10% of total lead time. Most of the elapsed time is work waiting in a queue.</p></div>`},
{h:"The 8 wastes: DOWNTIME", html:`
<p>Ohno described seven wastes; the eighth (unused talent) was added later. The acronym <strong>DOWNTIME</strong> helps you remember them.</p>
<div class="tbl"><table>
<tr><th>Waste</th><th>Definition</th><th>Office / service example</th></tr>
<tr><td><strong>D</strong>efects</td><td>Errors that need rework or cause complaints</td><td>Wrong invoice amount, missing data on a form, incorrect shipment address</td></tr>
<tr><td><strong>O</strong>verproduction</td><td>Producing more or earlier than needed</td><td>Reports nobody reads, printing copies "just in case", processing requests before they're due</td></tr>
<tr><td><strong>W</strong>aiting</td><td>Idle time for people or work</td><td>Approvals stuck in an inbox, waiting for system access, customer on hold</td></tr>
<tr><td><strong>N</strong>on-utilised talent</td><td>Not using people's skills and ideas</td><td>Experts doing data entry; staff never asked how to improve their work</td></tr>
<tr><td><strong>T</strong>ransportation</td><td>Moving work or information unnecessarily</td><td>Emailing files between five teams, physical routing of paper forms</td></tr>
<tr><td><strong>I</strong>nventory</td><td>Work piled up beyond what's needed</td><td>Backlog of unprocessed tickets, 400 unread emails, stock of unused forms</td></tr>
<tr><td><strong>M</strong>otion</td><td>Unnecessary movement by people</td><td>Switching between six apps, searching for files, walking to a shared printer</td></tr>
<tr><td><strong>E</strong>xtra-processing</td><td>Doing more than the customer requires</td><td>Three signatures on a low-value purchase, re-keying data, gold-plated formatting</td></tr>
</table></div>
<p>Note the difference between <strong>transportation</strong> (moving the <em>work</em>) and <strong>motion</strong> (moving the <em>person</em>).</p>`},
{h:"Muda, mura, muri", html:`
<p>Toyota describes three related forms of waste:</p>
<ul>
<li><strong>Muda</strong>: waste, the 8 wastes above.</li>
<li><strong>Mura</strong>: unevenness. Workload that spikes and drops (month-end close crunch, Monday-morning call surges).</li>
<li><strong>Muri</strong>: overburden. Pushing people or systems beyond reasonable capacity.</li>
</ul>
<p>They feed each other: uneven demand (mura) creates overburden at peaks (muri), which causes errors and rework (muda). That's why levelling the workload (<em>heijunka</em>) is often a powerful fix in office processes.</p>`},
{h:"Seeing waste: the Gemba walk", html:`
<p><em>Gemba</em> means "the real place", where the work happens. For an office process, the gemba might be a claims team's queue, the ERP screen or the shared inbox. A <strong>Gemba walk</strong> is going there to observe, ask questions and listen, not to judge.</p>
<ul>
<li>Follow one unit of work (an order, a claim) from start to end.</li>
<li>Ask "what are you waiting for?" and "what makes this step hard?"</li>
<li>Count queues, hand-offs, systems used and workarounds.</li>
<li>Thank people. Never use a Gemba walk to assign blame.</li>
</ul>
<div class="callout example"><span class="eyebrow">Business example</span><p>A procurement team followed one purchase request through the process. It touched 4 systems, was printed twice, waited 6 days for a signature from a manager who approved 99% of requests unchanged, and was re-keyed into the ERP by a buyer. Waste found: waiting, extra-processing, transportation, defects (re-keying errors) and motion.</p></div>`}
],
quiz:[
{q:"What is the first Lean principle?", o:["Flow","Pull","Specify value from the customer's view","Perfection"], a:2, why:"Everything starts with defining value as the customer sees it."},
{q:"An employee emails the same spreadsheet through five departments for comments. Which waste is this mainly?", o:["Motion","Transportation","Overproduction","Inventory"], a:1, why:"Moving the work (information) between places is transportation. Motion is the person moving."},
{q:"A team prepares a weekly 40-page report that no one reads. This is:", o:["Overproduction","Defects","Waiting","Non-utilised talent"], a:0, why:"Producing something before or beyond what's needed is overproduction, often called the worst waste because it creates others."},
{q:"A mandatory anti-money-laundering check in account opening is best classified as:", o:["Value-added","Business-value-added","Non-value-added","Overproduction"], a:1, why:"The customer doesn't value it, but law requires it. Keep it, make it as efficient as possible."},
{q:"Month-end close creates a massive spike in accounting workload. This unevenness is called:", o:["Muda","Mura","Muri","Kaizen"], a:1, why:"Mura is unevenness. The overburden that results at peak is muri."},
{q:"Which of these is NOT one of the three tests for a value-added step?", o:["The customer cares about it","It changes the product or service","It's done right the first time","It is required by an auditor"], a:3, why:"Required-by-audit makes it business-value-added, not value-added."},
{q:"A senior analyst spends half her week copy-pasting data between systems. The most specific waste is:", o:["Inventory","Non-utilised talent","Overproduction","Transportation"], a:1, why:"A skilled person doing low-skill work is non-utilised talent (re-keying is also extra-processing)."},
{q:"The main purpose of a Gemba walk is to:", o:["Audit employee performance","Observe the real work and understand the process","Present the future state","Train new hires"], a:1, why:"Go see, ask why, show respect. It's observation, not inspection."},
{q:"Which waste best describes 1,800 support tickets sitting in a backlog?", o:["Inventory","Motion","Defects","Extra-processing"], a:0, why:"Work piled up waiting to be processed is inventory (it also causes waiting for the customer)."}
],
questions:[
{q:"Walk through your own email inbox. Find at least four of the 8 wastes and give a concrete example of each.", model:"Inventory: hundreds of unread messages. Waiting: emails waiting on someone else's reply before you can act. Transportation: forwarding attachments back and forth instead of sharing one live document. Extra-processing: reply-all threads with 15 people who only need the outcome. Motion: switching between email, chat and three tools to find one file. Defects: missing information that triggers a clarification round."},
{q:"A sales quote process takes 5 days. Actual work by the sales engineer is 2 hours. List what is likely happening in the remaining time and which wastes those represent.", model:"Waiting for pricing approval from a manager (waiting); waiting for technical specs from engineering (waiting, transportation of the request); quote rejected because of a wrong discount code and redone (defects); re-entering customer data from CRM into the quoting tool (extra-processing); quotes queued behind larger deals (inventory). Value-added time is 2 of ~40 working hours, about 5%."},
{q:"Why is overproduction often called the worst of the wastes?", model:"Because it creates the others. Producing too much or too early generates inventory, needs storage and transportation, hides defects in the pile, ties up people and cash, and consumes capacity that could have served real demand. In offices, unneeded reports and early processing clog queues the same way excess stock clogs a warehouse."}
]},

/* ---------------------------------------------------------------- 3 */
{id:"m3", belt:"yellow", title:"Mapping and Measuring Business Processes", time:"75 min",
summary:"SIPOC, swimlane maps and value stream maps, plus the flow metrics every process improver must know.",
objectives:[
 "Build a SIPOC to scope a process",
 "Draw a swimlane map that exposes hand-offs",
 "Create a simple current-state value stream map",
 "Calculate lead time, cycle time, takt time, process cycle efficiency and use Little's Law"],
sections:[
{h:"SIPOC: the 30,000-foot view", html:`
<p>A <strong>SIPOC</strong> lists Suppliers, Inputs, Process (5–7 high-level steps), Outputs and Customers. It fits on one page and sets the boundaries of what you're improving.</p>
<div class="tbl"><table>
<tr><th>Suppliers</th><th>Inputs</th><th>Process</th><th>Outputs</th><th>Customers</th></tr>
<tr><td>Vendors<br>Purchasing<br>Receiving dock</td><td>Invoice<br>Purchase order<br>Goods receipt</td><td>1. Receive invoice<br>2. Scan and index<br>3. 3-way match<br>4. Resolve exceptions<br>5. Approve<br>6. Schedule payment</td><td>Paid invoice<br>Ledger entry<br>Remittance advice</td><td>Vendors<br>Finance controller<br>Auditors</td></tr>
</table></div>
<p>Tip: fill it in the order <strong>P → O → C → I → S</strong>. Start with the process steps, then ask what they produce and who receives it.</p>`},
{h:"Swimlane (cross-functional) maps", html:`
<p>A <strong>swimlane map</strong> puts each role or department in its own horizontal lane and draws steps in sequence. Every time the flow crosses a lane, you have a <strong>hand-off</strong>, which is where delays, lost information and errors cluster.</p>
<ul>
<li>Use standard symbols: oval (start/end), rectangle (activity), diamond (decision), arrow (flow).</li>
<li>Map the process <strong>as it really is</strong>, including workarounds, not as the procedure manual says.</li>
<li>Mark pain points with sticky-note "red dots": rework loops, waits, duplicated checks.</li>
</ul>`},
{h:"Value stream mapping (VSM)", html:`
<p>A <strong>value stream map</strong> adds data to the map. For each step you record:</p>
<ul>
<li><strong>Process time (PT)</strong> or touch time: hands-on work time for one unit.</li>
<li><strong>Wait time</strong> before the step (queue time).</li>
<li><strong>% Complete & Accurate (%C&A)</strong>: share of work the next step receives without needing to correct or chase it.</li>
<li>Number of people, systems used, batch sizes, WIP in the queue.</li>
</ul>
<p>At the bottom, a <strong>timeline ladder</strong> separates process time from wait time so the waste is obvious.</p>
<div class="callout example"><span class="eyebrow">Worked example: supplier invoice approval</span>
<div class="tbl"><table>
<tr><th>Step</th><th class="num">Wait before</th><th class="num">Process time</th><th class="num">%C&A</th></tr>
<tr><td>Receive and scan</td><td class="num">1.0 day</td><td class="num">5 min</td><td class="num">95%</td></tr>
<tr><td>3-way match</td><td class="num">2.0 days</td><td class="num">10 min</td><td class="num">70%</td></tr>
<tr><td>Resolve exceptions</td><td class="num">3.5 days</td><td class="num">25 min</td><td class="num">80%</td></tr>
<tr><td>Manager approval</td><td class="num">4.0 days</td><td class="num">3 min</td><td class="num">98%</td></tr>
<tr><td>Schedule payment</td><td class="num">1.5 days</td><td class="num">7 min</td><td class="num">99%</td></tr>
<tr><td><strong>Total</strong></td><td class="num"><strong>12.0 days</strong></td><td class="num"><strong>50 min</strong></td><td class="num">RTY ≈ 52%</td></tr>
</table></div>
<p>Rolled %C&A = 0.95 × 0.70 × 0.80 × 0.98 × 0.99 ≈ 0.52. Only about half of invoices pass through without someone fixing something.</p></div>`},
{h:"The flow metrics", html:`
<div class="tbl"><table>
<tr><th>Metric</th><th>Definition</th><th>Formula</th></tr>
<tr><td>Lead time</td><td>Total elapsed time from customer request to delivery (what the customer feels)</td><td>End time − start time</td></tr>
<tr><td>Cycle time</td><td>Time between completions of consecutive units at a step (how often one comes out). Some organisations use it to mean processing time; always define it.</td><td>Available time ÷ units completed</td></tr>
<tr><td>Process (touch) time</td><td>Hands-on time actually working on a unit</td><td>Sum of task times</td></tr>
<tr><td>Takt time</td><td>The pace of customer demand</td><td>Available time ÷ customer demand</td></tr>
<tr><td>Process cycle efficiency (PCE)</td><td>Share of lead time that is value-added</td><td>VA time ÷ lead time</td></tr>
<tr><td>Throughput</td><td>Units completed per period</td><td>Count ÷ time</td></tr>
<tr><td>WIP</td><td>Units started but not finished</td><td>Count at a point in time</td></tr>
</table></div>
<p><strong>Little's Law</strong> links three of them and is the single most useful equation in process improvement:</p>
<div class="formula">Lead time = WIP ÷ Throughput</div>
<p>If 600 claims are in progress and the team completes 50 per day, the average claim takes 600 ÷ 50 = <strong>12 days</strong>. To cut lead time you either increase throughput or, usually cheaper, <strong>reduce WIP</strong> (stop starting, start finishing).</p>
<p>Using the invoice example: lead time ≈ 12 days = 96 working hours (8-hour days); process time 50 min ≈ 0.83 h. PCE ≈ 0.83 ÷ 96 ≈ <strong>0.9%</strong>.</p>`},
{h:"Takt time in an office", html:`
<p>A customer onboarding team works 7.5 productive hours a day (450 minutes) and receives 90 new client requests per day.</p>
<div class="formula">Takt = 450 min ÷ 90 requests = 5 min per request</div>
<p>If onboarding one client takes 20 minutes of touch time, the team needs at least 20 ÷ 5 = <strong>4 people</strong> working the process to keep pace, before allowing for breaks, rework or absence. If the cycle time of the team is slower than takt, a backlog will grow every day.</p>`},
{h:"Mapping traps to avoid", html:`
<ul>
<li>Mapping the "should be" process instead of the real one. Walk it; don't map from a meeting room.</li>
<li>Too much detail too early. Start with SIPOC, then 10–20 steps, then zoom into the problem area.</li>
<li>Ignoring the information flow. In offices, the "material" is information; map systems and data too.</li>
<li>Using averages only. A step averaging 2 days may range from 1 hour to 3 weeks; record the range.</li>
<li>Mapping without the people who do the work. They know the workarounds.</li>
</ul>`}
],
quiz:[
{q:"In a SIPOC, the 'P' section should contain about how many steps?", o:["1–2","5–7","20–30","As many as possible"], a:1, why:"SIPOC is a high-level scoping tool. 5–7 steps keeps it readable."},
{q:"Where do delays and errors most often cluster on a swimlane map?", o:["At the start oval","At hand-offs between lanes","Inside decision diamonds only","At the end oval"], a:1, why:"Each lane crossing is a hand-off with queues, lost context and miscommunication."},
{q:"A team has 300 open requests and finishes 25 per day. What is the average lead time?", o:["7.5 days","12 days","25 days","275 days"], a:1, why:"Little's Law: 300 ÷ 25 = 12 days."},
{q:"Takt time is:", o:["The time to complete one unit","The pace of customer demand: available time ÷ demand","Lead time minus wait time","The time a step waits for input"], a:1, why:"Takt sets the rhythm the process must match to meet demand."},
{q:"A process has 30 minutes of value-added time and a lead time of 5 working days (40 hours). PCE is about:", o:["1.25%","12.5%","30%","75%"], a:0, why:"30 min = 0.5 h; 0.5 ÷ 40 = 1.25%."},
{q:"Which change usually reduces lead time most cheaply, according to Little's Law?", o:["Hiring more staff","Reducing work-in-progress","Adding a quality check","Working overtime"], a:1, why:"With throughput constant, lower WIP means shorter lead time, and limiting WIP costs little."},
{q:"%C&A on a value stream map measures:", o:["Percent of time spent on value-added work","Share of work the next step can use without correction","Customer satisfaction score","Capacity utilisation"], a:1, why:"Percent Complete and Accurate is quality as judged by the downstream step."},
{q:"Four steps have %C&A of 90%, 80%, 95% and 90%. Roughly what share flows through with no rework anywhere?", o:["About 62%","About 80%","About 89%","About 95%"], a:0, why:"0.9 × 0.8 × 0.95 × 0.9 ≈ 0.616."},
{q:"Customer demand is 240 orders per 8-hour shift (480 min). Takt time is:", o:["0.5 min","2 min","4 min","8 min"], a:1, why:"480 ÷ 240 = 2 minutes per order."}
],
questions:[
{q:"Create a SIPOC for an employee onboarding process (from signed offer to first productive day).", model:"Suppliers: recruiting, HR, IT, hiring manager, facilities, payroll provider. Inputs: signed offer, personal details, role profile, equipment, system access requests. Process: 1) Confirm hire and start date 2) Collect documents and set up in HRIS 3) Order equipment and accounts 4) Prepare workspace and induction plan 5) Day-one induction 6) Role training and first assignment. Outputs: employee record, working laptop and access, completed induction, first task assigned. Customers: new hire, hiring manager, payroll/compliance."},
{q:"Practice calculation: A loan-processing team has 450 applications in progress and completes 30 per day. Management wants a 5-day lead time. What must WIP be at the current throughput, and what throughput would you need at the current WIP?", model:"Current lead time = 450 ÷ 30 = 15 days. For 5 days at 30/day, WIP must fall to 5 × 30 = 150 applications. Keeping WIP at 450 would require throughput of 450 ÷ 5 = 90 per day, triple the capacity. Reducing WIP (limit new starts, clear stuck items) is far cheaper."},
{q:"Practice calculation: A help desk is open 8 hours with 60 minutes of breaks per agent. It receives 140 tickets a day, and each ticket takes 12 minutes of agent work. Calculate takt time and the minimum number of agents.", model:"Available time = 480 − 60 = 420 min. Takt = 420 ÷ 140 = 3 min per ticket. Agents needed = work content ÷ takt = 12 ÷ 3 = 4 agents (minimum, with no allowance for variation, rework or absence; in practice plan for more)."},
{q:"Why can't you rely on average times when building a value stream map?", model:"Averages hide variation. A step with a 2-day average might usually take 2 hours but occasionally 3 weeks when an approver is on leave. Customers experience the spread, not the average, and the long tail often points to the real root cause. Record ranges or percentiles (e.g. median and 90th percentile) alongside the average."}
]},

{id:"m4", belt:"yellow", title:"Lean Tools for Flow", time:"80 min",
summary:"5S, standard work, pull and kanban, batch reduction, bottlenecks, error-proofing, visual management and kaizen.",
objectives:[
 "Apply 5S to physical and digital workspaces",
 "Use pull, WIP limits and smaller batches to improve flow",
 "Find and manage a bottleneck with the Theory of Constraints",
 "Design poka-yoke (error-proofing) for office processes",
 "Plan and run a kaizen event"],
sections:[
{h:"5S: organise the workplace", html:`
<div class="tbl"><table>
<tr><th>S</th><th>Japanese</th><th>Meaning</th><th>Digital workplace example</th></tr>
<tr><td>Sort</td><td>Seiri</td><td>Remove what isn't needed</td><td>Archive obsolete files and templates</td></tr>
<tr><td>Set in order</td><td>Seiton</td><td>A place for everything</td><td>Agreed folder structure and naming convention</td></tr>
<tr><td>Shine</td><td>Seiso</td><td>Clean and inspect</td><td>Fix broken links, clean master data</td></tr>
<tr><td>Standardise</td><td>Seiketsu</td><td>Make the first three routine</td><td>Templates, checklists, ownership per folder</td></tr>
<tr><td>Sustain</td><td>Shitsuke</td><td>Build the habit</td><td>Monthly 15-minute audit with a simple score</td></tr>
</table></div>
<p>5S is not tidying for its own sake. Its purpose is to make abnormalities visible and cut search time (motion waste). Office workers often spend significant time each week looking for information.</p>`},
{h:"Standard work", html:`
<p><strong>Standard work</strong> is the current best-known way to do a task, written down and used by everyone. It includes the sequence of steps, the time each takes and the key quality points.</p>
<ul>
<li>It's the baseline for improvement: "without a standard there can be no improvement" (often attributed to Taiichi Ohno).</li>
<li>It reduces variation between people and shifts, which is a Six Sigma goal too.</li>
<li>It's owned and updated by the people doing the work. A standard that never changes means improvement stopped.</li>
</ul>
<p>In offices, standard work looks like checklists, templates, decision rules ("approve automatically if under $500 and on contract") and short how-to videos.</p>`},
{h:"Pull, kanban and WIP limits", html:`
<p>In a <strong>push</strong> system, work is started whenever it arrives and pushed onto the next step regardless of whether it can cope. Queues grow, lead times stretch and priorities get lost.</p>
<p>In a <strong>pull</strong> system, a step only starts new work when the next step signals capacity. A <strong>kanban</strong> ("signal card") board makes this visible: columns for each stage, cards for each item, and a <strong>WIP limit</strong> per column.</p>
<div class="callout example"><span class="eyebrow">Business example</span><p>A marketing team had 46 campaigns "in progress" and delivered each in about 9 weeks. They introduced a kanban board with a WIP limit of 12. Throughput stayed the same (about 5 per week), so by Little's Law the average lead time dropped to roughly 12 ÷ 5 ≈ 2.4 weeks. Stakeholders got campaigns earlier, and fewer were cancelled halfway.</p></div>`},
{h:"Batch size and one-piece flow", html:`
<p>Processing work in large batches (approving invoices once a week, running payroll corrections monthly) creates waiting for every item in the batch. <strong>Smaller batches</strong> or <strong>one-piece flow</strong> let each item move to the next step as soon as it's done.</p>
<p>Example: 10 forms, three steps, 1 minute each. In a batch of 10, the first form is finished after 21 minutes and the last after 30. In one-piece flow, the first is done after 3 minutes and the last after 12.</p>
<p>Batches exist because switching between tasks has a cost (setup or changeover). Reduce that cost and smaller batches become economical. That's the idea behind <strong>SMED</strong> (Single-Minute Exchange of Die, by Shigeo Shingo): convert <em>internal</em> setup (done while the process is stopped) into <em>external</em> setup (done in advance). Office version: prepare templates, access and data before the meeting or month-end, not during it.</p>`},
{h:"Bottlenecks: Theory of Constraints", html:`
<p>A process can only go as fast as its slowest step, the <strong>constraint</strong> or bottleneck. Eliyahu Goldratt's <strong>five focusing steps</strong>:</p>
<ol>
<li><strong>Identify</strong> the constraint (look for the biggest queue in front of a step).</li>
<li><strong>Exploit</strong> it: make sure it never waits and only does work only it can do.</li>
<li><strong>Subordinate</strong> everything else to it: don't flood it; feed it at its pace.</li>
<li><strong>Elevate</strong> it: add capacity, automate, cross-train.</li>
<li><strong>Repeat</strong>: the constraint will move; find the next one.</li>
</ol>
<p>An hour lost at the bottleneck is an hour lost for the whole system. An hour saved at a non-bottleneck is often an illusion.</p>`},
{h:"Poka-yoke: error-proofing", html:`
<p><strong>Poka-yoke</strong> (Shingo again) designs the process so mistakes are impossible or immediately obvious. It beats inspection because it prevents the defect instead of catching it later.</p>
<ul>
<li><strong>Prevention</strong>: drop-down lists instead of free text; mandatory fields; date pickers that block weekend delivery dates.</li>
<li><strong>Detection</strong>: duplicate-invoice warnings; IBAN checksum validation; a red banner when an order exceeds credit limit.</li>
</ul>
<p>Hierarchy of controls from strongest to weakest: eliminate the step → make the error impossible → make it obvious → rely on inspection → rely on training and memory.</p>`},
{h:"Visual management, jidoka and heijunka", html:`
<ul>
<li><strong>Visual management</strong>: anyone should see the state of the process in seconds. Team boards with today's demand, backlog and red/green status are common in service teams.</li>
<li><strong>Jidoka / andon</strong>: when something is wrong, stop and signal. In an office, that's a clear way to flag a blocked item and get help fast, instead of quietly working around it.</li>
<li><strong>Heijunka</strong>: level the mix and volume of work. Spread month-end tasks across the month, or route a share of simple requests to a fast lane.</li>
</ul>`},
{h:"Kaizen and kaizen events", html:`
<p><strong>Kaizen</strong> means "change for the better": small, continuous, everyone-involved improvement. A <strong>kaizen event</strong> (or rapid improvement workshop) is a focused 3–5 day session where a cross-functional team maps, redesigns and implements improvements to one process.</p>
<div class="tbl"><table>
<tr><th>Phase</th><th>What happens</th></tr>
<tr><td>Prep (2–4 weeks before)</td><td>Charter, scope, team, baseline data, sponsor agreement</td></tr>
<tr><td>Day 1</td><td>Train the team, walk the gemba, map the current state</td></tr>
<tr><td>Day 2</td><td>Find waste and root causes, design the future state</td></tr>
<tr><td>Day 3–4</td><td>Implement and test changes, write standard work</td></tr>
<tr><td>Day 5</td><td>Report out to leadership, agree the 30-day action list</td></tr>
<tr><td>Follow-up</td><td>Track metrics for 30/60/90 days</td></tr>
</table></div>`}
],
quiz:[
{q:"Which 5S step involves removing items that aren't needed?", o:["Shine","Sort","Standardise","Sustain"], a:1, why:"Sort (seiri) separates what's needed from what isn't."},
{q:"A kanban board with WIP limits is an example of:", o:["Push","Pull","Batching","Inspection"], a:1, why:"New work is pulled only when a column has capacity."},
{q:"In Goldratt's five focusing steps, what comes right after 'Identify the constraint'?", o:["Elevate it","Exploit it","Subordinate everything to it","Remove it"], a:1, why:"Identify, Exploit, Subordinate, Elevate, Repeat. Exploiting existing capacity is cheaper than adding capacity."},
{q:"A form field that only accepts a valid 10-digit account number is a:", o:["Detection poka-yoke","Prevention poka-yoke","Kanban signal","Standard work instruction"], a:1, why:"It makes the error impossible to enter, so it prevents the defect."},
{q:"SMED reduces changeover time mainly by:", o:["Hiring setup specialists","Converting internal setup to external setup","Running larger batches","Skipping quality checks"], a:1, why:"Prepare everything possible while the process is still running."},
{q:"Why does reducing batch size usually cut lead time?", o:["Each item waits less for the rest of its batch","People work faster","It removes the need for approvals","It increases WIP"], a:0, why:"In big batches every item waits for the whole batch before moving on."},
{q:"An hour saved at a non-bottleneck step:", o:["Increases total throughput by an hour","Usually doesn't increase total throughput","Always reduces quality","Moves the bottleneck"], a:1, why:"Throughput is set by the constraint. Faster non-constraints just build bigger queues in front of it."},
{q:"Heijunka refers to:", o:["Stopping the line on defects","Levelling the volume and mix of work","Sorting the workplace","Continuous improvement"], a:1, why:"Heijunka = production levelling, the cure for mura."},
{q:"What is the main purpose of standard work?", o:["To prevent any future change","To create a stable baseline that improvement builds on","To evaluate employee speed","To satisfy auditors only"], a:1, why:"Standard work stabilises the process so you can see and improve on it."}
],
questions:[
{q:"Design three poka-yokes for an online order-entry process used by a sales team.", model:"1) Product codes picked from a searchable catalogue, never typed (prevention). 2) Delivery address validated against a postcode database with an auto-complete (prevention). 3) System blocks submission if the discount exceeds the rep's authority level and routes it for approval automatically (prevention plus detection). Others: duplicate-order warning for same customer and items within 24 hours; credit limit check at entry."},
{q:"A claims process has these steps and capacities per day: Intake 120, Assessment 60, Approval 150, Payment 200. Demand is 80 per day. Where is the bottleneck, what happens over time, and what would you do first?", model:"Assessment (60/day) is the constraint and below demand (80/day), so the queue in front of Assessment grows by about 20 claims per day. First, exploit it: remove non-assessment work from assessors (admin, chasing documents), make sure intake sends only complete claims, and stagger breaks so assessment never stops. Subordinate intake so it doesn't flood the queue with incomplete files. Then elevate: cross-train approvers (who have spare capacity) to handle simple assessments, or create a fast lane with rules-based assessment for low-value claims."},
{q:"Plan a one-week kaizen event to reduce the time it takes to issue customer refunds. Who is on the team and what are the daily goals?", model:"Team: refund clerks (2), a customer service agent, a finance/AP representative, an IT person who knows the ERP, the process owner, a facilitator; sponsor attends day 1 and day 5. Prep: charter with baseline (e.g. 9 days average), target (3 days), scope (request received to money returned). Day 1: training, gemba walk, current-state VSM. Day 2: waste identification, root causes, future-state design. Day 3: implement quick wins (approval thresholds, templates, fast lane). Day 4: test with live refunds, write standard work. Day 5: report-out, 30-day action list, metrics board."}
]},

{id:"m5", belt:"yellow", title:"Six Sigma Essentials", time:"70 min",
summary:"Defects, DPMO, sigma levels, yield, cost of poor quality, voice of the customer and the DMAIC roadmap.",
objectives:[
 "Calculate DPU, DPMO, first-pass yield and rolled throughput yield",
 "Convert DPMO to an approximate sigma level",
 "Translate voice of the customer into measurable CTQs",
 "Estimate cost of poor quality",
 "Describe the five DMAIC phases and when to use DMAIC vs. Lean quick wins"],
sections:[
{h:"Defects, units and opportunities", html:`
<ul>
<li><strong>Unit</strong>: the thing being processed (an invoice, a call, an order).</li>
<li><strong>Defect</strong>: any failure to meet a customer requirement (wrong amount, late, missing field).</li>
<li><strong>Defective</strong>: a unit with one or more defects. A unit can have many defects but is defective only once.</li>
<li><strong>Opportunity</strong>: a distinct chance for a defect that the customer cares about. Define opportunities carefully; inflating them makes the sigma level look better than it is.</li>
</ul>
<div class="formula">DPU  = defects ÷ units
DPO  = defects ÷ (units × opportunities per unit)
DPMO = DPO × 1,000,000</div>
<div class="callout example"><span class="eyebrow">Worked example</span><p>An AP team processes 2,000 invoices. Each has 5 opportunities (vendor, amount, GL code, due date, PO match). Audit finds 180 defects.<br>DPU = 180 ÷ 2,000 = 0.09. DPO = 180 ÷ 10,000 = 0.018. DPMO = <strong>18,000</strong>, about <strong>3.6 sigma</strong>.</p></div>`},
{h:"Sigma levels", html:`
<p>The sigma level expresses how many standard deviations fit between the process average and the nearest specification limit. By convention, tables include a <strong>1.5σ shift</strong> to reflect long-term drift.</p>
<div class="tbl"><table>
<tr><th class="num">Sigma level</th><th class="num">DPMO</th><th class="num">Yield</th><th>What it feels like</th></tr>
<tr><td class="num">1</td><td class="num">691,462</td><td class="num">30.9%</td><td>Mostly wrong</td></tr>
<tr><td class="num">2</td><td class="num">308,538</td><td class="num">69.1%</td><td>Wrong a third of the time</td></tr>
<tr><td class="num">3</td><td class="num">66,807</td><td class="num">93.3%</td><td>Typical for many office processes</td></tr>
<tr><td class="num">4</td><td class="num">6,210</td><td class="num">99.38%</td><td>Good company average</td></tr>
<tr><td class="num">5</td><td class="num">233</td><td class="num">99.977%</td><td>Very good</td></tr>
<tr><td class="num">6</td><td class="num">3.4</td><td class="num">99.99966%</td><td>World class</td></tr>
</table></div>
<p>Notice it's not linear: going from 3σ to 4σ is about a 10× improvement; 5σ to 6σ is about 70×. Not every process needs six sigma. Target the level the customer and business case justify.</p>`},
{h:"Yield: FPY and RTY", html:`
<p><strong>First-pass yield (FPY)</strong> is the share of units that go through a step right the first time, with no rework. <strong>Rolled throughput yield (RTY)</strong> is the chance a unit passes through every step without any rework:</p>
<div class="formula">RTY = FPY₁ × FPY₂ × FPY₃ × … × FPYₙ</div>
<p>A 6-step process where each step is 95% right first time has RTY = 0.95⁶ ≈ <strong>73.5%</strong>. More than a quarter of the work needs fixing somewhere, even though each step "looks fine". This is the <strong>hidden factory</strong>: the rework that never shows up in final-output metrics.</p>`},
{h:"Cost of poor quality (COPQ)", html:`
<p>COPQ is the money lost because work isn't done right the first time. It's often grouped as:</p>
<ul>
<li><strong>Internal failure</strong>: rework, corrections, re-approvals, write-offs found before the customer sees them.</li>
<li><strong>External failure</strong>: refunds, credit notes, complaints handling, penalties, churn.</li>
<li><strong>Appraisal</strong>: inspections, audits, reconciliations.</li>
<li><strong>Prevention</strong>: training, error-proofing, planning (the "good" spend).</li>
</ul>
<p>Industry estimates often put COPQ at 15–25% of revenue for organisations operating around three to four sigma. Much of it is invisible ("that's just how the job works"). Quantifying COPQ is how you build the business case for a project.</p>`},
{h:"Voice of the customer → CTQ", html:`
<p><strong>Voice of the customer (VOC)</strong> is what customers say they need, collected through surveys, complaints, interviews, call recordings and reviews. It's usually vague: "I want fast service." Six Sigma converts it into a <strong>Critical-to-Quality (CTQ)</strong> requirement that you can measure:</p>
<div class="tbl"><table>
<tr><th>Need (VOC)</th><th>Driver</th><th>CTQ (measurable)</th></tr>
<tr><td>"Fast refunds"</td><td>Time to money back</td><td>Refund credited within 3 business days of approval, 95% of the time</td></tr>
<tr><td>"Bills I can trust"</td><td>Invoice accuracy</td><td>Zero line-item errors per invoice</td></tr>
<tr><td>"Someone who solves it"</td><td>First-contact resolution</td><td>≥ 80% of tickets resolved without a second contact</td></tr>
</table></div>
<p>The <strong>Kano model</strong> helps prioritise: <em>basic</em> needs cause anger if missing but no delight if present (a correct bill); <em>performance</em> needs give more satisfaction the better they are (speed); <em>delighters</em> surprise customers (proactive status updates). Delighters become basic needs over time.</p>`},
{h:"DMAIC: the roadmap", html:`
<p>Six Sigma improvement projects follow <strong>DMAIC</strong>. Each phase ends with a <strong>tollgate</strong> review with the sponsor.</p>
<div class="dmaic">
<div><b>D</b><span class="q">Define</span><span class="t">What's the problem and why does it matter? Charter, SIPOC, VOC, CTQ.</span></div>
<div><b>M</b><span class="q">Measure</span><span class="t">How bad is it today? Data collection, MSA, baseline, capability.</span></div>
<div><b>A</b><span class="q">Analyze</span><span class="t">What are the root causes? Fishbone, 5 Whys, hypothesis tests, regression.</span></div>
<div><b>I</b><span class="q">Improve</span><span class="t">What fixes the root causes? Solutions, pilot, future-state process.</span></div>
<div><b>C</b><span class="q">Control</span><span class="t">How do we hold the gain? Control plan, SPC, standard work, handover.</span></div>
</div>
<p><strong>When to use what:</strong> if the solution is known and low-risk, "just do it". If the cause is clear but the process is messy, run a kaizen event. If the root cause is unknown and the problem is chronic and measurable, run a DMAIC project. For a brand-new process, Six Sigma uses <strong>DMADV</strong> (Define, Measure, Analyze, Design, Verify), also called Design for Six Sigma.</p>`}
],
quiz:[
{q:"500 orders, 4 opportunities each, 60 defects found. DPMO is:", o:["30,000","12,000","120,000","3,000"], a:0, why:"60 ÷ (500 × 4) = 0.03 → 30,000 DPMO."},
{q:"A unit with three errors on it counts as:", o:["Three defectives","Three defects and one defective","One defect","Zero defects if corrected"], a:1, why:"Defects are counted individually; the unit is defective once."},
{q:"Four steps have first-pass yields of 98%, 90%, 95% and 99%. RTY is about:", o:["95.5%","83%","90%","98%"], a:1, why:"0.98 × 0.90 × 0.95 × 0.99 ≈ 0.830."},
{q:"Roughly how many DPMO correspond to 4 sigma?", o:["66,807","6,210","233","3.4"], a:1, why:"4σ ≈ 6,210 DPMO with the 1.5σ shift."},
{q:"A credit note issued after a customer complains about a wrong invoice is which COPQ category?", o:["Prevention","Appraisal","Internal failure","External failure"], a:3, why:"The customer found the failure, so it's external."},
{q:"In the Kano model, a hotel room being clean is a:", o:["Delighter","Performance need","Basic (must-be) need","Indifferent attribute"], a:2, why:"No one is delighted by a clean room, but everyone is angry about a dirty one."},
{q:"Which phase of DMAIC establishes the baseline performance?", o:["Define","Measure","Analyze","Control"], a:1, why:"Measure quantifies current performance so you can prove improvement later."},
{q:"You are designing a brand-new customer portal. Which roadmap fits best?", o:["DMAIC","DMADV / Design for Six Sigma","5S","A kaizen event"], a:1, why:"DMAIC improves existing processes; DMADV designs new ones."},
{q:"'The hidden factory' refers to:", o:["Outsourced work","Rework and corrections not visible in final output metrics","Automated back-office systems","A night shift"], a:1, why:"Final yield can look fine while lots of capacity is spent fixing things along the way."}
],
questions:[
{q:"Practice calculation: A payroll team processes 1,500 payslips per month. Each has 6 opportunities for error. Last month 45 defects were found across 38 payslips. Calculate DPU, DPMO, % defective, and estimate the sigma level.", model:"DPU = 45 ÷ 1,500 = 0.03. DPMO = 45 ÷ (1,500 × 6) × 1,000,000 = 5,000. % defective = 38 ÷ 1,500 = 2.53%. 5,000 DPMO is just above 4 sigma (≈ 4.1σ with the 1.5 shift). Note the sigma level based on % defective would be much lower (≈ 3.45σ); this is why the definition of opportunity must be agreed upfront."},
{q:"Translate these three customer complaints into CTQs: (a) 'I never know where my order is', (b) 'Your agents keep transferring me', (c) 'The invoice never matches the quote'.", model:"(a) Proactive status notification sent at each of 4 milestones; ≥ 98% of orders have tracking available within 2 hours of dispatch. (b) ≤ 1 transfer per call; first-contact resolution ≥ 80%. (c) Invoice line prices equal quoted prices for 100% of lines; invoice-to-quote mismatch rate < 0.5% of invoices."},
{q:"Estimate COPQ: A distributor issues 900 credit notes per year due to pricing errors, averaging $210 each. Each takes 45 minutes of staff time at $40/hour fully loaded, plus customers who get a wrong invoice twice churn at an estimated 30 per year with $8,000 annual margin each. What is the annual COPQ from these items?", model:"Credit value: 900 × $210 = $189,000. Labour: 900 × 0.75 h × $40 = $27,000. Churn: 30 × $8,000 = $240,000. Total ≈ $456,000 per year, before counting appraisal (audits) and reputational effects. That's a strong business case for a project."}
]},

{id:"m6", belt:"green", title:"DMAIC: Define", time:"60 min",
summary:"Pick the right problem, write a charter that survives contact with stakeholders, and set clear scope.",
objectives:[
 "Select projects using impact and feasibility",
 "Write a factual problem statement and a SMART goal",
 "Build a project charter with scope, team and business case",
 "Map stakeholders and plan communication"],
sections:[
{h:"Choosing the right project", html:`
<p>Good projects connect to a strategic priority, have a measurable problem, an unknown root cause, a scope the team can finish in 3–6 months, and a sponsor who cares. Bad projects have a solution already chosen ("implement a new CRM"), a scope like "fix customer service", or no data.</p>
<p>Score candidates on <strong>impact</strong> (customer, financial, risk) and <strong>effort</strong> (time, cost, complexity). Start with high-impact, moderate-effort projects. Low-effort fixes don't need DMAIC; just do them.</p>`},
{h:"The problem statement", html:`
<p>A problem statement describes <strong>what</strong> is wrong, <strong>where</strong>, <strong>when</strong>, <strong>how big</strong> and <strong>the impact</strong>. It contains no cause, no blame and no solution.</p>
<div class="callout example"><span class="eyebrow">Weak vs strong</span>
<p><strong>Weak:</strong> "Refunds are too slow because the finance team is understaffed. We need a new system."</p>
<p><strong>Strong:</strong> "From January to June 2026, customer refunds for online orders took an average of 9.4 business days from request to credit (target: 3 days). 41% of refund-related contacts were repeat 'where is my refund' calls, costing an estimated $310,000 a year in handling and driving a 12-point lower NPS among affected customers."</p></div>`},
{h:"The goal statement: SMART", html:`
<p>Goals should be <strong>S</strong>pecific, <strong>M</strong>easurable, <strong>A</strong>chievable, <strong>R</strong>elevant and <strong>T</strong>ime-bound. A common rule of thumb for a first project is to aim to close about half the gap between today and the target.</p>
<div class="formula">Reduce average refund lead time for online orders
from 9.4 to 4.0 business days by 31 March 2027,
with 90% of refunds completed within 5 days.</div>`},
{h:"The project charter", html:`
<div class="tbl"><table>
<tr><th>Element</th><th>Contents</th></tr>
<tr><td>Business case</td><td>Why now? Link to strategy, money, customers or risk</td></tr>
<tr><td>Problem statement</td><td>As above: what, where, when, how big, impact</td></tr>
<tr><td>Goal statement</td><td>SMART goal and the primary metric (Y)</td></tr>
<tr><td>Secondary / guardrail metrics</td><td>What must not get worse (e.g. refund fraud rate, cost per refund)</td></tr>
<tr><td>Scope</td><td>In scope and out of scope; start and end points of the process</td></tr>
<tr><td>Team and roles</td><td>Sponsor, process owner, belt leader, members, time commitment</td></tr>
<tr><td>Timeline</td><td>Target date for each DMAIC tollgate</td></tr>
<tr><td>Risks and constraints</td><td>System freezes, budget limits, regulatory requirements</td></tr>
</table></div>
<p>Use an <strong>in/out of scope</strong> frame to stop scope creep. If a stakeholder wants to add "and also returns processing", it goes in the parking lot or a separate project.</p>`},
{h:"Stakeholders and communication", html:`
<p>Projects fail more often from people issues than from statistics. Map stakeholders by <strong>influence</strong> and <strong>interest</strong>, and note where each is today (opposed, neutral, supportive) and where you need them.</p>
<ul>
<li>High influence, high interest: manage closely (sponsor, process owner).</li>
<li>High influence, low interest: keep satisfied (CFO, IT director).</li>
<li>Low influence, high interest: keep informed (front-line staff, who may also be your best idea source).</li>
<li>Low influence, low interest: monitor.</li>
</ul>
<p>A <strong>RACI</strong> chart (Responsible, Accountable, Consulted, Informed) clarifies decision rights for each deliverable. Only one person should be Accountable per task.</p>`},
{h:"Define tollgate checklist", html:`
<ul>
<li>Is the problem measurable with data we can get?</li>
<li>Is the scope narrow enough to finish in the timeline?</li>
<li>Do we have a SIPOC and the CTQs from VOC?</li>
<li>Has the sponsor signed the charter, including team time?</li>
<li>Is there a guardrail metric so we don't improve one thing by breaking another?</li>
</ul>`}
],
quiz:[
{q:"Which belongs in a good problem statement?", o:["The suspected root cause","The proposed solution","The size and impact of the problem","Who is to blame"], a:2, why:"Describe what, where, when, how big and impact. No causes, blame or solutions."},
{q:"'Implement a new ticketing tool' is a poor Six Sigma project because:", o:["Tools are expensive","The solution is predetermined","Ticketing isn't a process","It's too small"], a:1, why:"DMAIC is for problems with unknown root causes. A predetermined solution skips Analyze."},

{q:"In a RACI chart, how many people should be 'Accountable' for a task?", o:["None","Exactly one","At least two","Everyone involved"], a:1, why:"One accountable owner avoids diffused responsibility."},
{q:"A stakeholder with high influence and low interest should be:", o:["Ignored","Managed closely","Kept satisfied","Only informed"], a:2, why:"Keep them satisfied so they don't block the project, without overloading them."},
{q:"Which is the best scoped project?", o:["Improve customer experience","Reduce invoice errors company-wide in all 14 countries","Reduce the error rate of domestic supplier invoices in the UK AP team from 8% to 3% by June","Make finance more efficient"], a:2, why:"Specific process, location, metric, baseline, target and date."}
],
